# The project's name, which its images, containers and volumes carry
# (wingtip-gateway, wingtip_pgdata): fixed here, not taken from the folder
# it is run from, so a checkout under another name -- a worktree -- runs
# the same stack (the owner renamed the app Wingtip, 2026-11-06).
name: wingtip

# Shared, not copy-pasted into each service below -- the Python
# services (planner and, once, model-service and the agents) had
# byte-identical healthcheck timing, which meant a change to it (say, a
# longer start_period) only actually landing wherever someone
# remembered to also paste it. `x-` prefixed
# keys are Compose's own convention for a block that exists purely to
# be referenced by anchor -- ignored as a service definition, kept for
# `<<`/`*` to pull from.
x-python-healthcheck: &python-healthcheck
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 10s

# The gateway's public address, said once: where its emailed links point,
# and the issuer of the connector's tokens that the planner checks
# (docs/design/mcp-connector.md). The gateway's environment below says why
# it is worked out this way.
x-public-base-url: &public-base-url ${PHONE_BASE_URL:-${PUBLISH_ADDRESS:+${PHONE_BASE_URL:?set PHONE_BASE_URL=https://<this Mac's LAN address>:8443 in .env}}${APP_PUBLIC_BASE_URL:-http://localhost:8080}}
# The secret the planner's connector shows the gateway's /internal/mcp
# records with: no default, so none is shared by every checkout. `make dev`
# (scripts/dev/dev.sh doctor) writes a random one of this machine's own into
# .env; the gateway will not start with the connector on (MCP_ENABLED) and
# none set.
x-mcp-internal-token: &mcp-internal-token ${MCP_INTERNAL_TOKEN:-}

# Every long-running service below restarts with Docker (restart:
# unless-stopped): after a reboot, Docker Desktop brings back whatever
# was running -- the phone's ports included, since it is the same
# container -- and a service someone stopped stays stopped. The
# jobs are one-shot and have none.
#
# One file for every way the stack runs on a machine of one's own; the
# phone, the LAN and front-end work used to be overlays of their own
# (docker-compose.phone.yml, .lan.yml, .web-dev.yml), which every `up`
# had to name again, and an `up` that forgot one quietly took the phone's
# ports away or served the image's bundle. They are settings now, read
# from .env (or the shell), so the stack is whatever .env says it is:
#
#   The phone, over the Wi-Fi (https://<this Mac's LAN address>:8443):
#     PUBLISH_ADDRESS=0.0.0.0     gateway's two ports and the sign-in inbox
#                                 on every interface, not loopback
#     PHONE_BASE_URL=https://<this Mac's LAN address>:8443
#                                 where the emailed sign-in link points
#     MAILPIT_UI_AUTH=<user>:<password>
#                                 the inbox's password: it holds sign-in
#                                 links, the developer's among them
#     The last two are required once PUBLISH_ADDRESS is set; compose
#     refuses to start without them. See infra/local-https for the
#     certificate.
#   The developer's doors from another device:
#     DEV_PUBLISH_ADDRESS=0.0.0.0 Jupyter's port (8888), which answers
#                                 without authentication and runs code,
#                                 so a network you control, for as long as
#                                 you need it. The database, the planner
#                                 (8084, whose developer routes the
#                                 gateway alone checks) are never
#                                 published beyond loopback.
#   Front-end work without rebuilding the image:
#     COMPOSE_PROFILES=web-dev    starts web-build (vite --watch into
#                                 apps/web/dist)
#     WEB_DIST_MOUNT=/app/static/app
#                                 and the gateway serves apps/web/dist in place
#                                 of the bundle in its image
#
# Unset, every port is on 127.0.0.1 and the gateway serves its own bundle.

services:
  # wingtip's Python base (services/Dockerfile.base): Python, wingtip's own
  # requirements and its Rust extension, built once and named by every
  # image that imports wingtip as its `wingtip-base` context
  # (`service:base` below), so `docker compose build planner`
  # builds it first, from this checkout, with nothing pulled from a
  # registry. Never run: scaled to zero, so `up` starts none of it. Not
  # behind a profile, because compose leaves a profiled service out of the
  # project, and a context naming it is then "an unknown service" (the
  # e2e job's `up` failed on exactly that).
  base:
    scale: 0
    build:
      context: .
      dockerfile: services/Dockerfile.base
      target: base

  # Jupyter, for the notebooks: on demand, behind its own profile, so a
  # plain `docker compose up` leaves its image and its memory alone.
  # `docker compose up ml` (a service named on the command line starts
  # whatever its profile), or the developer console's System tab, which
  # starts its container once it has one (dev-services).
  ml:
    profiles: ["notebooks"]
    build:
      context: .
      dockerfile: ml/Dockerfile.ml
      additional_contexts:
        wingtip-base: service:base
    ports:
      # 127.0.0.1-bound, not 0.0.0.0 -- this and every other non-gateway
      # port below are local-debugging conveniences, not a public surface
      # (gateway is the only intended front door, see
      # PlannerProxyController.java's own docstring). Binding to
      # localhost keeps `docker compose up` safe to run on a shared or
      # internet-reachable host without also publishing an
      # unauthenticated Jupyter/DB/service port to it.
      - "${DEV_PUBLISH_ADDRESS:-127.0.0.1}:8888:8888"
    volumes:
      - .:/workspace

  # The jobs (services/jobs): one-off work, not services. Behind the
  # `jobs` profile and with no restart, so a plain `docker compose up`
  # never starts one -- it used to start the training image, whose
  # default is a full all-core retrain that then overwrote the candidate
  # model the registry compares next. Each runs this checkout's code (the
  # project mounted at /workspace, as the planner's is). The developer
  # console starts them through dev-services, which can start a container
  # but never create one: `docker compose create retrain charts
  # charts-overlays charts-next` makes them once. services/jobs/README.md has the rest.
  #
  # The training run (`python -m wingtip.pipeline run`: both models'
  # stages in order, each promoted only if it beats the one serving), the
  # console's Retrain; a stage by name: `docker compose run --rm retrain
  # collect`. It replaced Airflow (the owner, 2026-11-06): a scheduler, a
  # web server and a metadata database for a DAG that had no schedule
  # and was only ever started from here.
  retrain:
    build:
      context: .
      dockerfile: services/jobs/retrain/Dockerfile
      additional_contexts:
        wingtip-base: service:base
    profiles: ["jobs"]
    command: ["run"]
    volumes:
      - .:/workspace

  # The charts job: a new FAA chart cycle fetched, rendered and packed
  # into one archive per kind and density, then the map's overlay tiles
  # where the planner's cycle pack has none (`python -m charts run`).
  # The planner starts it (app.chart_refresh) when a cycle is due and the
  # night's window is open, and from the console's "refresh now"; by
  # hand: `docker compose run --rm charts` (or a command of its own,
  # `docker compose run --rm charts pack`). The planner only serves what
  # it writes.
  charts: &charts-job
    build:
      context: .
      dockerfile: services/jobs/charts/Dockerfile
      additional_contexts:
        wingtip-base: service:base
    profiles: ["jobs"]
    command: ["run", "--workers", "${CHARTS_REFRESH_WORKERS:-1}"]
    volumes:
      - .:/workspace

  # The overlay tiles alone, a minute or two of tippecanoe: what the
  # planner starts when it writes a new cycle pack, at any hour.
  charts-overlays:
    <<: *charts-job
    command: ["overlays"]

  # The FAA's next chart cycle, staged before its date (`python -m charts
  # next`, wingtip.chart_next): from CHARTS_CYCLE_LEAD_DAYS (7) before it,
  # its sheets fetched, rendered with as many workers as the memory left
  # holds, and packed into its own folder, which the map takes at 0901Z
  # on its date; after that, the cycles before it deleted. The planner
  # starts it hourly inside CHARTS_REFRESH_WINDOW where CHARTS_CYCLE_AUTO
  # is on (app.chart_refresh). It takes a turn among the Mac's heavy work
  # as scripts/dev/one-at-a-time.sh gives them out, through that script's
  # lock directories in the Mac's /tmp (charts/turn.py): it waits for a
  # turn rather than render beside a test suite or an image build.
  charts-next:
    <<: *charts-job
    command: ["next"]
    environment:
      CHARTS_CYCLE_LEAD_DAYS: ${CHARTS_CYCLE_LEAD_DAYS:-7}
      ONE_AT_A_TIME_LOCK: /host-tmp/flight-plan-heavy.lock
      ONE_AT_A_TIME_SLOTS: ${ONE_AT_A_TIME_SLOTS:-2}
    volumes:
      - .:/workspace
      - /tmp:/host-tmp

  # The crash-leads job (services/jobs/crash, docs/STUDIO-PIPELINE.md):
  # the FAA's statements and notices read into the Studio's crash leads,
  # each checked against the FAA's registry and an ADS-B track, and a kit
  # made for each confirmed one, into the live-store volume the planner
  # reads (wingtip.crash_drafts). It keeps its own schedule (`every`, on
  # wingtip.schedule): a run each CRASH_LEADS_EVERY_MIN, none with CRASH_LEADS_AUTO=0, which
  # ends it and leaves it ended. One run by hand, `docker compose run
  # --rm crash-leads poll` (or `parse-check`).
  crash-leads:
    restart: on-failure
    build:
      context: .
      dockerfile: services/jobs/crash/Dockerfile
      additional_contexts:
        wingtip-base: service:base
    command: ["every"]
    environment:
      LIVE_STORE: /live/live.sqlite
      NOTAM_STORE: /live/notams.sqlite
      CRASH_LEADS_AUTO: ${CRASH_LEADS_AUTO:-1}
      CRASH_LEADS_EVERY_MIN: ${CRASH_LEADS_EVERY_MIN:-30}
    volumes:
      - .:/workspace
      - live-store:/live

  db:
    restart: unless-stopped
    # Plain Postgres: the pgvector image was for the removed briefing
    # agent's memory. Trixie, the Debian every image here is built on
    # (2026-11-09). A volume made under bookworm (glibc 2.36) needs its
    # collation version refreshed once for 2.41:
    # scripts/dev/pg-refresh-collation.sh, which go-live.sh runs.
    image: postgres:18-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: wingtip
      POSTGRES_USER: wingtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wingtip}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingtip -d wingtip"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # pg18, not pg16: a Postgres major-version bump can't read an
      # existing data directory in place, so this is a new volume
      # (migrated via pg_dump/pg_restore, not initdb).
      # Mounted at /var/lib/postgresql (not .../data): the postgres
      # image changed its expected layout at 18, to a pg_ctlcluster-
      # style major-version-specific subdirectory under the mount
      # point, specifically so a future in-place pg_upgrade --link has
      # no mount-boundary issue. Mounting at .../data (the pre-18
      # convention) makes the 18 entrypoint refuse to start.
      - pgdata_pg18:/var/lib/postgresql

  # The developer console's one door onto Docker (infra/dev-services):
  # which of the services it may start are running, and starting one.
  # It holds the socket so planner doesn't, and answers those
  # two requests for those names in this project, nothing else --
  # no create, no exec, no other container.
  #
  # It replaced tecnativa/docker-socket-proxy with CONTAINERS and POST
  # granted, which the proxy's own rules turn into every method on every
  # /containers path, `POST /containers/create` included: a privileged
  # container with the host's / mounted, from anything that could reach
  # it. And everything could, because every service shared one network.
  # This one sits on `docker-control` alone, which only planner
  # also joins; gateway, ml and the rest cannot resolve it.
  dev-services:
    build:
      context: .
      dockerfile: infra/dev-services/Dockerfile
    environment:
      DEV_SERVICES: ml,retrain,charts,charts-overlays,charts-next
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [docker-control]
    restart: unless-stopped

  planner:
    restart: unless-stopped
    # Planning and chart vision: reads FAA sectional tiles, walks the great
    # circle, selects checkpoints and computes the dead-reckoning nav log.
    # Serves no pages -- the front end is built into gateway's jar, and the
    # browser reaches this only through gateway's /api/planner/* proxy.
    # Mounts the project so it can write a new corridor's candidates and
    # features into data/processed, and read the chart model a retrain
    # promotes into data/models/chart/current, which it scores with
    # in-process (app.chart_scorer) and reads again when it changes.
    build:
      context: .
      dockerfile: services/planner/Dockerfile
      additional_contexts:
        wingtip-base: service:base
    # Loopback only, whatever DEV_PUBLISH_ADDRESS says: the planner answers
    # without sign-in, its developer routes (/api/retrain,
    # /api/dev/services/*) and X-Pilot-Id among them, which the gateway
    # puts behind its developer check (DeveloperOnly); from the Wi-Fi it
    # would skip that check. Another device reaches it through the gateway.
    ports:
      - "127.0.0.1:8084:8000"
    # docker-control as well as the default network: the only service
    # besides dev-services itself that can reach the sidecar.
    networks: [default, docker-control]
    volumes:
      - .:/workspace
      # The stores ingest writes (the live store, the NOTAMs, the filed
      # routes; wingtip/stores.py) on a Docker volume, not the Mac's
      # shared folder: SQLite's write-ahead log needs shared memory
      # between the planner and ingest, which the Mac's file sharing into
      # Docker does not give, and ingest's writes hung (2026-11-08).
      - live-store:/live
    environment:
      # The stores ingest writes, on the volume above (wingtip/stores.py);
      # each takes the file it had on data/raw the first time.
      LIVE_STORE: /live/live.sqlite
      NOTAM_STORE: /live/notams.sqlite
      FILED_STORE: /live/filed.sqlite
      REPORTS_STORE: /live/reports.sqlite
      PYTHONPATH: /workspace/services/planner
      # Not the host's Docker socket -- the dev-services sidecar above,
      # which app/dev_services.py asks which services are up and to
      # start one, the jobs (retrain, charts) among them.
      DEV_SERVICES_URL: http://dev-services:8000
      # The clock the charts job's night-time window (see
      # services/planner/app/chart_refresh.py) is read against: the desk
      # this runs on, not UTC.
      TZ: ${TZ:-America/Chicago}
      # How many render processes the charts job is given (its command
      # above), for the console to show.
      CHARTS_REFRESH_WORKERS: ${CHARTS_REFRESH_WORKERS:-1}
      # The next chart cycle staged before its date by charts-next
      # (app.chart_refresh, wingtip.chart_next): on here, 0 to stop it;
      # how many days ahead it starts.
      CHARTS_CYCLE_AUTO: ${CHARTS_CYCLE_AUTO:-1}
      CHARTS_CYCLE_LEAD_DAYS: ${CHARTS_CYCLE_LEAD_DAYS:-7}
      # The live feeds watched (app.feed_health): a feed stale this many
      # minutes is an alert in the log and the console, and POSTed to
      # FEED_ALERT_WEBHOOK where one is set. The weather service's
      # freshness is asked at WEATHER_URL (http://weather:8000 by default).
      FEED_ALERT_AFTER_MIN: ${FEED_ALERT_AFTER_MIN:-15}
      FEED_ALERT_WEBHOOK: ${FEED_ALERT_WEBHOOK:-}
      # The connector (app.mcp): /mcp, its tokens issued by the gateway at
      # its public address, the pilot's records asked of it with this secret.
      MCP_ISSUER: *public-base-url
      MCP_INTERNAL_TOKEN: *mcp-internal-token
      # The map's Google overlay (routers/basemaps): a browser key for
      # Google's Map Tiles API, none by default.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # ADS-B Exchange through RapidAPI, the traffic's fallback where
      # adsb.lol turns the planner away (wingtip.traffic): off without it.
      ADSBX_RAPIDAPI_KEY: ${ADSBX_RAPIDAPI_KEY:-}
      # Traces to Jaeger, with the tracing profile up and TRACING=1 (see
      # the jaeger service below); unset, the planner sends none and loads
      # none of OpenTelemetry (app.tracing, wingtip.tracing).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TRACING:+http://jaeger:4318}
      TRACING: ${TRACING:-}
      OTEL_SERVICE_NAME: planner
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]

  # The live feeds, read always (services/ingest): the FAA's SWIM feeds
  # (STDDS's terminal radar, FNS's NOTAMs, TFMS's flight plans) and the
  # followed airplanes' adsb.fi rounds, written into the SQLite stores
  # under data/raw that the planner reads (the live store, wingtip.traffic.store;
  # the NOTAM and filed-route stores). No port: nothing calls it. The
  # project mounted as the planner's is, so both see one data folder and
  # ingest runs this checkout's code.
  ingest:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
      additional_contexts:
        wingtip-base: service:base
    volumes:
      - .:/workspace
      # The stores ingest writes (the live store, the NOTAMs, the filed
      # routes; wingtip/stores.py) on a Docker volume, not the Mac's
      # shared folder: SQLite's write-ahead log needs shared memory
      # between the planner and ingest, which the Mac's file sharing into
      # Docker does not give, and ingest's writes hung (2026-11-08).
      - live-store:/live
    # Production is one 4 GB server: ingest is a few threads and a SQLite
    # connection, 186 MB with wingtip's imports (docker stats, 2026-11-08),
    # so it is held to twice that, well below what would crowd the planner.
    mem_limit: 384m
    environment:
      # The stores it writes, on the volume above, as the planner reads them.
      LIVE_STORE: /live/live.sqlite
      NOTAM_STORE: /live/notams.sqlite
      FILED_STORE: /live/filed.sqlite
      REPORTS_STORE: /live/reports.sqlite
      PYTHONPATH: /workspace/services/ingest:/workspace/services/planner
      # The FAA's SWIM feeds (ingest.swim); each off without its own. The
      # owner's SCDS subscriptions' login and queues.
      SWIM_HOST: ${SWIM_HOST:-}
      SWIM_USERNAME: ${SWIM_USERNAME:-}
      SWIM_PASSWORD: ${SWIM_PASSWORD:-}
      SWIM_VPN_STDDS: ${SWIM_VPN_STDDS:-}
      SWIM_QUEUE_STDDS: ${SWIM_QUEUE_STDDS:-}
      SWIM_VPN_FNS: ${SWIM_VPN_FNS:-}
      SWIM_QUEUE_FNS: ${SWIM_QUEUE_FNS:-}
      SWIM_HOST_TFMS: ${SWIM_HOST_TFMS:-}
      SWIM_VPN_TFMS: ${SWIM_VPN_TFMS:-}
      SWIM_QUEUE_TFMS: ${SWIM_QUEUE_TFMS:-}
      # ITWS's alerts and SFDPS's airspace, on SWIM_HOST's broker.
      SWIM_VPN_ITWS: ${SWIM_VPN_ITWS:-}
      SWIM_QUEUE_ITWS: ${SWIM_QUEUE_ITWS:-}
      SWIM_VPN_SFDPS: ${SWIM_VPN_SFDPS:-}
      SWIM_QUEUE_SFDPS: ${SWIM_QUEUE_SFDPS:-}
      # Traces to Jaeger with TRACING=1 (the jaeger service below); unset,
      # it sends none and loads none of OpenTelemetry (wingtip.tracing).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TRACING:+http://jaeger:4318}
      TRACING: ${TRACING:-}
      OTEL_SERVICE_NAME: ingest
    healthcheck:
      <<: *python-healthcheck
      # Its beat in the live store, written every ten seconds (ingest.health),
      # so looked at every thirty, as the image's own HEALTHCHECK does: each
      # check is a Python started afresh.
      interval: 30s
      test: ["CMD", "python", "-m", "ingest.health"]

  # The weather the planner reads, fetched on a schedule (services/weather):
  # METARs, TAFs, SIGMETs, PIREPs and G-AIRMETs from aviationweather.gov,
  # the GFS's winds aloft and GLMP from NOMADS, TFRs from tfr.faa.gov and
  # the radar's time from IEM, each written to the weather store on the
  # data folder the planner mounts (data/raw/weather, wingtip.weather_store),
  # so no pilot's request waits on a live fetch (#535). Fast while the
  # planner is being used, slow otherwise. Its health check at :8000 says
  # how fresh each product is (`docker compose exec weather python3 -c
  # "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/').read().decode())"`).
  # Mounts the project as the planner does, so its code is the checkout's.
  weather:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/weather/Dockerfile
      additional_contexts:
        wingtip-base: service:base
    volumes:
      - .:/workspace
    environment:
      # Its own code first, then the planner's folder for wingtip.
      PYTHONPATH: /workspace/services/weather:/workspace/services/planner
      # Traces to Jaeger with TRACING=1 (the jaeger service below); unset,
      # it sends none and loads none of OpenTelemetry (wingtip.tracing).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TRACING:+http://jaeger:4318}
      TRACING: ${TRACING:-}
      OTEL_SERVICE_NAME: weather
    # Python, the engine, and a GLMP issue's two grids at their largest
    # while it reads them: well under this, which keeps it from crowding
    # the planner (infra/docker-compose.prod.yml has the same).
    mem_limit: 384m
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]

  # Where the local stack's sign-in emails go: an inbox of its own at
  # http://localhost:8025, sent nowhere. A mail host is what makes
  # signing in possible, so the local stack runs the way a deployment
  # does (SignInOptions' SIGN_IN): writes need a session, the training
  # workspace and the developer console need the developer role
  # (APP_DEVELOPER_EMAILS below). PUBLISH_ADDRESS opens the inbox to the
  # Wi-Fi, behind MAILPIT_UI_AUTH's password, for signing in on the phone.
  # Set MAIL_HOST and the rest in .env to send real mail instead.
  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8025:8025"
    environment:
      # The names the inbox answers to (Mailpit warns at start without a list:
      # a page elsewhere could reach it by DNS rebinding). An address such
      # as the phone's Wi-Fi one is always let through.
      MP_ALLOWED_HOSTS: localhost,mailpit
      # The inbox's password, required once PUBLISH_ADDRESS opens it to
      # the network (the inner :? is read only then); none on loopback.
      MP_UI_AUTH: ${PUBLISH_ADDRESS:+${MAILPIT_UI_AUTH:?set MAILPIT_UI_AUTH=<user>:<password> in .env -- the inbox holds sign-in links}}
      # The gateway always authenticates to its mail host
      # (application.yml): take whatever it sends, over the plain
      # connection, since nothing leaves this machine.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Off unless .env says otherwise: mail for the addresses matching
      # MAILPIT_RELAY_TO (a regular expression, e.g. your own) also goes
      # on to their real inbox through an external SMTP server, so a
      # sign-in link arrives where you read mail. Everything else, the
      # e2e suite's addresses included, stays here. Relaying from the
      # inbox by hand is held to the same addresses, since the inbox is
      # open to the Wi-Fi for the phone. The From is rewritten to
      # the relay account, which iCloud and most providers require.
      MP_SMTP_RELAY_HOST: ${MAILPIT_RELAY_HOST:-}
      MP_SMTP_RELAY_PORT: ${MAILPIT_RELAY_PORT:-587}
      MP_SMTP_RELAY_STARTTLS: "true"
      MP_SMTP_RELAY_AUTH: ${MAILPIT_RELAY_AUTH:-plain}
      MP_SMTP_RELAY_USERNAME: ${MAILPIT_RELAY_USERNAME:-}
      MP_SMTP_RELAY_PASSWORD: ${MAILPIT_RELAY_PASSWORD:-}
      MP_SMTP_RELAY_OVERRIDE_FROM: ${MAILPIT_RELAY_USERNAME:-}
      MP_SMTP_RELAY_MATCHING: ${MAILPIT_RELAY_TO:-}
      MP_SMTP_RELAY_ALLOWED_RECIPIENTS: ${MAILPIT_RELAY_TO:-}

  gateway:
    restart: unless-stopped
    # Context is the repo root: the image builds apps/web/ and bakes the
    # bundle into the jar, so this one service serves both.
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    # This machine only, like everything else here, unless
    # PUBLISH_ADDRESS (the top of this file) publishes these two on
    # every interface for a phone on the LAN, and the inbox behind a
    # password.
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8080:8080"
      # HTTPS, for a phone on the same Wi-Fi: only answers once
      # infra/local-https/make-certs.sh has written the certificate
      # (see HttpsConnectorConfig); otherwise the port is simply closed.
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8443:8443"
    volumes:
      - gateway-cds:/cds
      - ./infra/local-https/certs:/certs:ro
      # The bundle vite builds into apps/web/dist, served in place of the
      # image's where WEB_DIST_MOUNT=/app/static/app (the web-dev
      # profile's web-build keeps it built); otherwise mounted aside,
      # where the gateway never reads it.
      - ./apps/web/dist:${WEB_DIST_MOUNT:-/web-dist}:ro
    depends_on:
      db:
        condition: service_healthy
      planner:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Ready means Spring's readiness group (the app and its database)
    # says UP -- 20-30 s after the container starts, during which the
    # pages 404. `docker compose up --wait` holds until this passes, so
    # a test run started after it never meets a half-booted server.
    # bash's /dev/tcp, not curl: the JRE image has neither curl nor
    # wget. And CMD, not CMD-SHELL, which runs dash, where /dev/tcp
    # does not exist.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wingtip
      SPRING_DATASOURCE_USERNAME: wingtip
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-wingtip}
      PLANNER_SERVICE_URL: http://planner:8000
      # The monitor's minute check (UptimeWatch, docs/OPERATIONS.md): the
      # weather service watched beside the planner, and
      # its alerts mailed to an address of their own in the local inbox,
      # where the e2e suite's sign-in links never meet them; APP_ALERT_EMAILS
      # in .env sends them to yours.
      WEATHER_SERVICE_URL: http://weather:8000
      APP_ALERT_EMAILS: ${APP_ALERT_EMAILS:-alerts@example.com}
      # Traces to Jaeger with TRACING=1, the planner's calls under the
      # gateway's (see the jaeger service); off otherwise.
      MANAGEMENT_TRACING_EXPORT_ENABLED: ${TRACING:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # Local start-up time, not a production setting. The class-data
      # archive (kept on the gateway-cds volume, see the Dockerfile) lets
      # a restart of the same jar skip the class loading and
      # verification it already did; C1-only JIT starts faster and
      # this proxy never runs hot enough locally to miss C2. The AWS
      # task definition sets neither.
      JAVA_TOOL_OPTIONS: -XX:+AutoCreateSharedArchive -XX:SharedArchiveFile=/cds/gateway.jsa -XX:TieredStopAtLevel=1
      # Sign-in with Google/Apple, optional: `docker compose up` must still work with none of these
      # set (the `oauth` Spring profile stays inactive and OIDC sign-in
      # is just not offered), but real values in the shell or a .env
      # file now actually reach OAuthClientsConfig instead of going
      # nowhere. Apple needs all four of its own to activate -- see that
      # class's own javadoc for what each one is and where it comes from
      # in Apple's developer portal.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # The magic-link email flow's own sender -- independent of the
      # `oauth` profile above (see application.yml's own comment). The
      # local inbox by default (mailpit above), which accepts any login;
      # a real mail server needs all four set in .env.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-local}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-local}
      MAIL_FROM: ${MAIL_FROM:-no-reply@wingtipmaps.app}
      # Where the emailed sign-in link points. Required once a mail host
      # is set -- the gateway will not start without it -- because a link
      # built from the request's own Host header points wherever the
      # caller said. PHONE_BASE_URL points it at this Mac's LAN address
      # so the link opens on the phone, and is required once
      # PUBLISH_ADDRESS publishes the gateway (the :? inside is read
      # only then).
      APP_PUBLIC_BASE_URL: *public-base-url
      # The connector's authorization server (security/mcp): off unless
      # MCP_ENABLED=true (docs/MCP-CONNECTOR.md); the secret its internal
      # records ask for, on the internal port 8081 that nothing publishes
      # (InternalPortConfig); and its signing key (blank: one made at start,
      # so a restart signs Claude and ChatGPT out until they refresh).
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_INTERNAL_TOKEN: *mcp-internal-token
      MCP_SIGNING_KEY: ${MCP_SIGNING_KEY:-}
      # Whose pilot is a developer: the address the e2e suite signs in
      # as (apps/web/e2e/auth.setup.ts), and whichever APP_DEVELOPER_EMAILS in
      # .env adds -- yours, comma-separated.
      APP_DEVELOPER_EMAILS: developer@example.com,${APP_DEVELOPER_EMAILS:-}
      # The speed lab's token, for a lab run sent to this stack (SpeedController).
      APP_SPEED_LAB_TOKEN: ${APP_SPEED_LAB_TOKEN:-}
      # The emailed link's throttle, per address and per caller, loose
      # here: a Playwright run asks for a handful, and a morning of runs
      # would meet the deployed limits of 5 and 20 an hour.
      APP_MAGIC_LINK_PER_ADDRESS_PER_HOUR: "60"
      APP_MAGIC_LINK_PER_CLIENT_PER_HOUR: "200"
      # The HTTPS port for a phone on the same Wi-Fi (HttpsConnectorConfig):
      # the certificate infra/local-https/make-certs.sh writes, read
      # only once that file exists. HSTS off: this machine's plain port
      # must keep working after the HTTPS one has been used once.
      # Opened with the gateway's default password, which is the one
      # make-certs.sh writes it with.
      APP_HTTPS_KEYSTORE: ${APP_HTTPS_KEYSTORE:-/certs/gateway.p12}
      APP_HSTS: "false"

  # Front-end work without the image: vite in watch mode keeping apps/web/dist
  # built as the source changes, which the gateway serves where
  # WEB_DIST_MOUNT=/app/static/app (above) -- read per request
  # (APP_STATIC_LOCATION, see WebMvcConfig), so a build is served the
  # moment vite has written it, no image, no restart. A saved file is
  # rebuilt in a second or two (`docker compose logs -f web-build` shows
  # each build). The image build (the bundle, then the jar) and the JVM's
  # start were the minute and a half between a change and a test. `npm run
  # types` first when an API schema changed. The image is still what
  # ships; CI builds its own. Behind the `web-dev` profile:
  # COMPOSE_PROFILES=web-dev in .env, or `--profile web-dev`.
  web-build:
    profiles: ["web-dev"]
    image: node:26-slim@sha256:5adad64f9a1fca2d51972caa65983634c8a774eb300d72b20f7f2a0f60368072
    working_dir: /w
    volumes:
      - ./apps/web:/w
    # VITE_PUBLISH_DIR (read by vite.config.ts): each build is written
    # whole into apps/web/.dist-next and then renamed into dist file by
    # file, index.html last, so a page loading mid-build gets the old
    # build or the new one, never half of one; the replaced builds' files
    # stay an hour for pages already open (2026-11-08, a phone's
    # "Importing a module script failed").
    environment:
      VITE_PUBLISH_DIR: dist
    command: ["npx", "--no-install", "vite", "build", "--watch"]
    restart: unless-stopped

  # Traces of a request from the page's call through the gateway, the
  # planner (each engine rule, each weather product read, each source
  # asked), and of the weather service's fetches and ingest's rounds, in
  # Jaeger's UI on http://localhost:16686 (docs/LOCAL-DEV.md, "Tracing"):
  #
  #   TRACING=1 docker compose --profile tracing up -d
  #
  # Without TRACING no service makes a span or sends one. The services
  # send OTLP over HTTP to jaeger:4318 on the compose network; only the
  # UI is published, on loopback.
  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

networks:
  # dev-services and planner only (see dev-services above).
  # Internal: nothing on it needs to reach outside the host.
  docker-control:
    internal: true

volumes:
  # The planner's and ingest's shared live store (see their mounts).
  live-store:
  pgdata_pg18:
  # gateway's JVM class-data archive -- see JAVA_TOOL_OPTIONS on gateway.
  gateway-cds:
