# SwiftLint (MIT, .tool-versions' version) over the iPhone app, run by
# scripts/ci/phone_lint.sh ios on the Swift files a change touches. Only the
# rules below: the code's layout is SwiftFormat's (scripts/dev/format.sh),
# and the cross-language bans (unit constants, Mercator, hand HTTP to the
# planner, great-circle maths) are Semgrep's, once for every language
# (scripts/ci/semgrep/; CLAUDE.md, "Simplicity rules"). What is here is the
# dead code a Swift parser sees. Today's findings are held in
# swiftlint-baseline.json, which only shrinks.
#
# Periphery, the usual Swift dead-code finder, was archived on 2026-08-12
# (github.com/peripheryapp/periphery), so the unused declarations and
# imports are SwiftLint's analyzer rules below, which read a build's
# compiler log (`swiftlint analyze --compiler-log-path`); they need the iOS
# job's xcodebuild log and are not run on a pull request.
only_rules:
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - unused_setter_value
  - redundant_discardable_let
analyzer_rules:
  - unused_declaration
  - unused_import
included:
  - apps/ios/Wingtip
  - apps/ios/WingtipWidgets
  - apps/ios/WingtipWatch
excluded:
  # generated by scripts/build/api-models-apps.sh from the OpenAPI documents
  - apps/ios/WingtipAPI
  - apps/ios/Wingtip/API/Generated
  - apps/ios/Wingtip/Engine/Generated
  - apps/ios/Wingtip/Design/Generated
  - apps/ios/Wingtip/Navigation/Generated
strict: true
