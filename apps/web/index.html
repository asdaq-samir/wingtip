<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The viewport a full-screen chart needs. No `user-scalable=no` or
         `maximum-scale`: the page may be pinch-zoomed (WCAG 1.4.4, and
         Lighthouse's accessibility audit; the owner's decision of
         2026-11-08, #265). A pinch on the map still zooms the chart,
         not the page: MapLibre puts `touch-action: pan-x pan-y` on its
         canvas container, so the browser leaves that gesture to it.
         `viewport-fit=cover`: the map draws edge to edge behind a notch
         or Dynamic Island, and it is also what makes
         `env(safe-area-inset-*)` non-zero, which the header and the
         map's own buttons pad themselves by. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Installed to the Home Screen this runs with no browser chrome at
         all, which is the only way to be rid of Safari's address bar:
         it never collapses here, because the page deliberately has no
         document scroll for it to collapse on (see the style below).
         The manifest's own `display: standalone` (vite.config.ts) is what
         iOS actually reads; this is the non-deprecated belt-and-braces
         for anything that looks for a meta tag instead. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The pre-hydration fallback -- useDocumentTitle overrides this
         per page once React mounts, so a tab open before that (or a
         crawler that never runs JS) still sees a real title. -->
    <title>Wingtip Maps</title>
    <meta name="description" content="The map for flying: every airport and airspace on the chart, and the route, checkpoints and nav log when you go." />
    <meta name="apple-mobile-web-app-title" content="Wingtip" />
    <!-- A shared route's preview (Share this route, in Messages and the
         like): the app's name, its line and its icon. -->
    <meta property="og:site_name" content="Wingtip Maps" />
    <meta property="og:title" content="Wingtip Maps" />
    <meta property="og:description" content="The map for flying: every airport and airspace on the chart, and the route, checkpoints and nav log when you go." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The Home Screen icon on iOS, which reads neither the SVG nor
         the manifest for it: a 180px PNG of the app icon, full bleed, for
         iOS rounds it itself. The tab's icon is the mark alone, which
         turns white on a dark browser.
         The status bar over the installed app translucent, the chart
         drawn under it, at the owner's pick (2026-10-21: the page stopped
         under a white status bar, not top to bottom as the iOS app is);
         its words white, read over a shade (index.css). The theme colour
         is the page's own background. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The icon for what reads no SVG (older browsers, bookmarks,
         feed readers): the small master at 16, 32 and 48 pixels. Marked
         32x32 so a browser that reads SVG still takes favicon.svg. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- The installed app's launch screen on iOS, which draws none from
         the manifest: the mark on the launch ground (design/tokens.json
         color.brand.launch, launch-night), one image per iPhone screen
         and scheme. Android draws its own from the manifest's name,
         icon and background_color. -->
    <!-- BEGIN launch images: generated by scripts/build/app-icons.sh -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/launch-440x956.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/launch-440x956-dark.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/launch-402x874.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/launch-402x874-dark.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/launch-430x932.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/launch-430x932-dark.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/launch-393x852.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/launch-393x852-dark.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/launch-390x844.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/launch-390x844-dark.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/launch-375x812.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/launch-375x812-dark.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/launch-414x896.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/launch-414x896-dark.png" />
    <!-- END launch images -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- theme-color: two metas, by the device's scheme, from the tokens (vite-plugins/manifest themeColor) -->
    <!-- Structural, not decorative: without this the page can grow a
         scrollbar of its own (even by a stray pixel), and a wheel over
         the map then fights the page for the scroll instead of MapLibre
         getting it cleanly -- felt as janky zoom rather than a crash.
         The print override matters for exactly one page, the Flight
         Briefing: it's taller than one screen and needs the browser's
         own pagination, which this height/overflow lock (two levels
         above Shell.tsx's own, already-overridden root div) would
         otherwise clip to a single viewport-height's worth no matter
         what any component further down declares. -->
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; }
      @media print {
        html, body { height: auto; overflow: visible; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
