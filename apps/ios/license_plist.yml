# LicensePlist's settings (scripts/build/licences.sh ios): the iPhone's
# acknowledgements, in Settings > Wingtip Maps > Acknowledgements as iOS
# apps keep them, and opened from About. The Swift packages' licences are
# read from their checkouts (the build's SourcePackages, offline); the
# rest is what SwiftPM does not know of, each kept here:
manual:
  # The engine, linked in (WingtipEngine): its Rust crates' licences,
  # generated by cargo-about (engine/licences, checked in the guards).
  - name: "Wingtip engine (Rust crates)"
    source: https://github.com/asdaq-samir/wingtip/tree/main/engine
    file: "../../engine/licences/NOTICES.txt"
  # Apache-2.0 4(d): a NOTICE file that ships with a work goes with it.
  # The three of Apple's packages that have one, word for word from their
  # checkouts (swift-http-types 1.8.0, swift-openapi-runtime 1.13.4,
  # swift-openapi-urlsession 1.4.0); licences.sh --check fails where a
  # checkout's NOTICE.txt no longer matches its file here.
  - name: "swift-http-types NOTICE"
    source: https://github.com/apple/swift-http-types
    file: "Licences/swift-http-types-NOTICE.txt"
  - name: "swift-openapi-runtime NOTICE"
    source: https://github.com/apple/swift-openapi-runtime
    file: "Licences/swift-openapi-runtime-NOTICE.txt"
  - name: "swift-openapi-urlsession NOTICE"
    source: https://github.com/apple/swift-openapi-urlsession
    file: "Licences/swift-openapi-urlsession-NOTICE.txt"
