# The native iOS app (docs/NATIVE.md): SwiftUI, no web view, a client of
# the same planner and gateway the website uses. XcodeGen makes the
# Xcode project from this file on GitHub's macOS runner (native-ios.yml);
# the project is never committed, and the owner's Mac, which cannot run a
# current Xcode, never needs it.
name: Wingtip
options:
  bundleIdPrefix: app.wingtipmaps
  deploymentTarget:
    iOS: "27.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    # Swift 6 language mode with complete concurrency checking, where a
    # data race is a compile error (Apple's direction for new code; the
    # owner's ask, 2026-11-03, made so once a run was clean, 2026-11-09).
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # No warnings anywhere: every target's warning is an error (the owner,
    # 2026-11-09), Swift's and clang's alike, so none piles up unread.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Every Text and LocalizedStringResource gathered into the string
    # catalog (Wingtip/Localizable.xcstrings) at build, Apple's way of
    # localising since Xcode 15: English today, another language a column.
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The site's host: the gateway, and the app's associated domain. CI
    # passes the repo's WINGTIP_URL host over this.
    WINGTIP_HOST: wingtipmaps.app
    # The app's bundle id, which CI passes the repo's IOS_BUNDLE_ID over
    # (native-ios.yml): one setting the app and its widget extension both
    # take their ids from, so the extension's stays the app's with its
    # suffix however CI names the app.
    WINGTIP_BUNDLE_ID: app.wingtipmaps.ios
# The Swift packages the app builds on, each at the exact version named
# here (the repo's one place for them; the owner's "use the latest
# libraries", 2026-11-12). XcodeGen resolves them on the runner.
packages:
  # The servers' clients (scripts/build/api-models-apps.sh): the generated
  # modules' runtime, its HTTP types, and its URLSession transport.
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    exactVersion: 1.13.4
  swift-http-types:
    url: https://github.com/apple/swift-http-types
    exactVersion: 1.8.0
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    exactVersion: 1.4.0
  # The gateway's session cookies in the Keychain (Shared/SessionCookies).
  Valet:
    url: https://github.com/square/Valet
    exactVersion: 5.1.1
  # Pictures from the planner, cached and kept for offline use
  # (Views/PictureViewer): its release candidate, Swift 6.2 and iOS 16 up.
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 14.0.0-rc.1
targetTemplates:
  ServerAPI:
    type: framework.static
    platform: iOS
    dependencies:
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(WINGTIP_BUNDLE_ID).$(TARGET_NAME)
        SKIP_INSTALL: YES
targets:
  Wingtip:
    type: application
    platform: iOS
    sources:
      - path: Wingtip
        excludes: ["Info.plist", "Wingtip.entitlements"]
      # The FAA's words for each ACS code: the web app's own file, bundled
      # as acs.json (AcsTable.bundled), not a copy kept beside it.
      - path: ../web/src/lib/acs.json
        buildPhase: resources
    dependencies:
      # The engine (engine/bindings/ffi/build-xcframework.sh, built on the runner
      # before this project is made): every rule by name and the readers of
      # the phone's cycle packs, with no network, through the Swift
      # uniffi-bindgen writes (WingtipEngine, below). Static, linked in.
      - target: WingtipEngine
      # The servers' generated clients (WingtipAPI), linked in, and the
      # packages the app calls them and its pictures and Keychain through.
      - target: PlannerAPI
      - target: GatewayAPI
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
      - package: Valet
      - package: Nuke
        products: [Nuke, NukeUI]
      # The Live Activity's widget extension, embedded in the app.
      - target: WingtipWidgets
        embed: true
      # The Apple Watch app (WingtipWatch), embedded in the app's Watch
      # folder as a companion is; it is installed with the phone's app.
      - target: WingtipWatch
        embed: true
    info:
      path: Wingtip/Info.plist
      properties:
        CFBundleDisplayName: Wingtip Maps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The launch screen: the mark on the app's own ground, light or
        # dark with the phone, as Apple asks a launch screen to look like
        # the first screen rather than a splash (HIG, Launching). Both are
        # drawn by scripts/build/app-icons.sh from docs/brand/mark.svg and
        # design/tokens.json's color.brand.launch and launch-night.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Read by Config at run time: the host the build was made for.
        WingtipHost: $(WINGTIP_HOST)
        # Honest about the background (the store audit's S1, App Review
        # 5.1.1(ii)): while flying the position keeps being read with the
        # app put away, and is sent to the planner to answer, not kept.
        NSLocationWhenInUseUsageDescription: Wingtip Maps shows your airplane on the chart, finds the airports near you and what is ahead, and plans from where you are. While you fly it keeps following your position, even with the app in the background, for the alerts ahead and the path flown. Your position is sent to answer these and not kept; a flight's track is kept only when you log or save it.
        # A clearance read on the radio, heard by Apple's recognizer on the
        # iPhone only (ClearanceListener's requiresOnDeviceRecognition); where
        # it cannot be, voice is not offered and neither is asked for.
        NSMicrophoneUsageDescription: Wingtip Maps listens to the radio to show what ATC says, tell you when ATC calls you, and enter a clearance's route for you to check, and hears the questions you ask it by voice. The sound is never recorded or sent.
        NSSpeechRecognitionUsageDescription: Wingtip Maps turns what ATC says on the radio, and the questions you ask it by voice, into words on your iPhone. Speech is recognised on the device and its sound never leaves it; a question you send goes where a typed one would.
        # A page photographed with the document camera (Documents/
        # DocumentScanner): a handbook's performance or weight and balance
        # page, a paper logbook page or a clearance copied down, read for
        # the pilot to confirm item by item. The photo library is reached
        # through the system's picker, which needs no permission.
        NSCameraUsageDescription: Wingtip Maps photographs a handbook page, a logbook page or a clearance you wrote down, to read its figures for you to check.
        # The radio heard on with the phone locked, as the owner asked
        # (2026-11-02): the microphone kept open (ClearanceListener); and
        # the position read on while the airplane is flying (OwnShip),
        # for the alerts ahead and the path flown (OwnTrail); and CloudKit's
        # silent pushes, so another device's records (Records) sync before
        # the app is opened; and iOS's background refresh, for the route's
        # weather watched after the Brief (WeatherWatch, its one task).
        UIBackgroundModes: [audio, location, remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.wingtipmaps.weather-watch]
        # Apple's Private Cloud Compute as the AI's fallback after the
        # on-device model (AppleModels, the owner's "Yes to AI cloud",
        # 2026-11-09). NO until Apple assigns the account the Private Cloud
        # Compute entitlement (developer.apple.com/private-cloud-compute:
        # the Small Business Program, under 2 million first-time
        # downloads); then YES, with the entitlement in Wingtip.entitlements.
        WingtipPrivateCloudCompute: false
        NSLocalNetworkUsageDescription: With Traffic on, Wingtip Maps listens on the cockpit's Wi-Fi for an ADS-B receiver (Stratux, SkyEcho, Sentry).
        # A flight in progress on the Lock Screen and in the Dynamic Island
        # (FlightActivity, the WingtipWidgets extension): the next
        # checkpoint, the ETA and the fuel, as Apple has ongoing things shown.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        # A track file (GPX, KML) opened from Files or Mail is flown again
        # on the map (Links, RootView): the app is a viewer of both, so
        # they show it in Open In; the types declared here, as neither
        # is a system one. A file is read once and flown, never edited
        # where it lies, so it is opened as a copy, not in place (what iOS
        # did with the key unset; set to say so, as the build asks).
        LSSupportsOpeningDocumentsInPlace: false
        # The app's own scheme, wingtipmaps://plan?open=<screen>, for a
        # Shortcut or another app to open a screen (design/screens.json);
        # the site's address opens the same screens as a universal link.
        CFBundleURLTypes:
          - CFBundleURLName: app.wingtipmaps.screens
            CFBundleURLSchemes: [wingtipmaps]
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPS Exchange Format
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx]
          - CFBundleTypeName: Keyhole Markup Language
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.google.earth.kml]
          # The app's own flight file (FlightFile, Save as File): opened
          # from Files, AirDrop or Mail into the Shared Flight preview,
          # never planned without the pilot's Use This Plan.
          - CFBundleTypeName: Wingtip Flight
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [app.wingtipmaps.flight]
        # The Wingtip flight file, the type this app owns and exports
        # (UTType.wingtipFlight): JSON holding the shared flight's plain
        # link and the nav log.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.wingtipmaps.flight
            UTTypeDescription: Wingtip Flight
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wingtip]
              public.mime-type: [application/vnd.wingtipmaps.flight+json]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
          - UTTypeIdentifier: com.google.earth.kml
            UTTypeDescription: Keyhole Markup Language
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [kml]
              public.mime-type: [application/vnd.google-earth.kml+xml]
    entitlements:
      path: Wingtip/Wingtip.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains:
          - applinks:$(WINGTIP_HOST)
        # The pilot's records (Records) in their iCloud, on every device:
        # the container named after the bundle id (iCloud.app.wingtipmaps.ios,
        # following CI's IOS_BUNDLE_ID as the id does), which the owner
        # turns on for the app id in the developer account; the push
        # entitlement is what CloudKit wakes the app with when another
        # device writes.
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        # Development here, which the archive's development signing needs;
        # the App Store export re-signs with the distribution profile and
        # the app carries that profile's value, production, in its place
        # (the profile's entitlements win over the file's at signing).
        # native-ios.yml checks the exported app where the export leaves
        # one (docs/NATIVE.md, "Push in the App Store build").
        aps-environment: development
        # A call to us on the radio, traffic near own ship and a watched
        # airplane's takeoff or landing are time-sensitive notifications
        # (Notifications.swift), the level that comes through a Focus;
        # iOS 15 and later want this entitlement for it.
        com.apple.developer.usernotifications.time-sensitive: true
        # The Home Screen widgets' snapshot of the next flight (WidgetFeed,
        # FlightWidget in WingtipWidgets), the saved flights and fields their
        # settings offer (WidgetStore), and the gateway session's cookies
        # the Currency Status widget reads with: one App Group the app
        # writes and the extension reads, which the owner turns on for both
        # app ids in the developer account.
        com.apple.security.application-groups: [group.app.wingtipmaps]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WINGTIP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No global accent colour: the system's own (systemBlue) is the
        # Native look's, and the brand looks set theirs at the root at run
        # time (Look.swift's lookTint: SwiftUI's tint and the window's).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  # The engine's Swift, written by uniffi-bindgen from the Rust each time
  # the XCFramework is built (engine/bindings/ffi/build-xcframework.sh,
  # not committed), over the XCFramework's C module (WingtipEngineFFI):
  # the app's `import WingtipEngine`.
  WingtipEngine:
    type: framework.static
    platform: iOS
    sources: [Frameworks/WingtipEngine/Generated/WingtipEngine.swift]
    dependencies:
      - framework: Frameworks/WingtipEngine/WingtipEngineFFI.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(WINGTIP_BUNDLE_ID).$(TARGET_NAME)
        SKIP_INSTALL: YES
        # The engine's static library is merged into this one by libtool,
        # which names each of Rust's empty compiler-builtins objects.
        OTHER_LIBTOOLFLAGS: -no_warning_for_no_symbols
  # The servers' clients, one module a document, written by
  # scripts/build/api-models-apps.sh with swift-openapi-generator from
  # services/{planner,gateway}/openapi.json and committed. A
  # module each, as each document has its own Client, Components and
  # Operations; the app names their schemas by API/Generated's aliases.
  PlannerAPI:
    templates: [ServerAPI]
    sources: [WingtipAPI/PlannerAPI]
  GatewayAPI:
    templates: [ServerAPI]
    sources: [WingtipAPI/GatewayAPI]
  # The Live Activity (WingtipWidgets/WingtipWidgets.swift): a flight in
  # progress on the Lock Screen and in the Dynamic Island, drawn by this
  # extension from the attributes the app shares with it (Wingtip/Shared).
  # Its bundle identifier is the app's with a suffix, as embedding needs.
  WingtipWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WingtipWidgets
        excludes: ["Info.plist", "WingtipWidgets.entitlements"]
      - path: Wingtip/Shared
      # The design tokens (scripts/build/design-tokens.sh): the flight
      # categories' colours, the same as the app's.
      - path: Wingtip/Design/Generated/Tokens.swift
      # The tokens' inks as SwiftUI colours, and every figure written as
      # the app writes it (formats.json): the Live Activity's words.
      - path: Wingtip/Design/Ink.swift
      - path: Wingtip/Format/Format.swift
      # The gateway's host, for the weather and currency widgets' own asks
      # (WidgetFetch), read from this extension's Info.plist (WingtipHost).
      - path: Wingtip/Config.swift
    # The Keychain the session's cookies are read from (SessionCookies).
    dependencies:
      - package: Valet
    entitlements:
      path: WingtipWidgets/WingtipWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.wingtipmaps]
    info:
      path: WingtipWidgets/Info.plist
      properties:
        CFBundleDisplayName: Wingtip Maps
        WingtipHost: $(WINGTIP_HOST)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WINGTIP_BUNDLE_ID).widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  # The Apple Watch app (WingtipWatch/, the owner's ask of 2026-11-03):
  # timers, the airplane's checklist and the nearest airports on the
  # wrist, a companion of the iOS app that asks the phone for everything
  # over WatchConnectivity (Wingtip/WatchLink.swift). No engine: the
  # XCFramework has no watchOS slice. Only the messages file is shared.
  WingtipWatch:
    type: application
    platform: watchOS
    sources:
      - path: WingtipWatch
      - path: Wingtip/Shared/WatchMessages.swift
    info:
      path: WingtipWatch/Info.plist
      properties:
        CFBundleDisplayName: Wingtip Maps
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A single-target watch app (watchOS 7+), the phone app's companion.
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(WINGTIP_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        NSLocationWhenInUseUsageDescription: Wingtip Maps finds the airports nearest you from where your watch is.
    dependencies:
      # Linked so the build's App Intents metadata step has its framework:
      # without it the step warned "Metadata extraction skipped, no
      # AppIntents.framework dependency found", the build's one warning
      # (IOS-24, the zero-warnings rule).
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WINGTIP_BUNDLE_ID).watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        # The small master on the chart's green (WingtipWatch/Assets.xcassets,
        # scripts/build/app-icons.sh): the watch draws its icon small and
        # round, where the full icon's lake and road are lost.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
  WingtipWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: WingtipWatchTests
    dependencies:
      - target: WingtipWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WingtipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WingtipTests
      # The shared fixtures of the rules the app keeps its own copy of for
      # flight with no signal (docs/NATIVE.md): the web's own files, read
      # by its vitest tests and by SharedFixturesTests, so a copy that
      # drifts from the other fails CI.
      - path: ../web/src/lib/fixtures
        buildPhase: resources
      # The engine's: the Chicago phone packs and the planner's answers at
      # each tap (services/planner/tests_wingtip/test_native.py holds them to the planner's code).
      - path: ../../services/planner/tests_wingtip/fixtures/native/phone
        buildPhase: resources
    dependencies:
      - target: Wingtip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # One launch smoke test driven through the app as a pilot would be,
  # XCUITest (WingtipUITests/LaunchTests): a build that compiles but
  # cannot show its first screen fails on the runner.
  WingtipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WingtipUITests
    dependencies:
      - target: Wingtip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Wingtip
schemes:
  Wingtip:
    build:
      targets:
        Wingtip: all
        WingtipWidgets: all
        WingtipTests: [test]
        WingtipUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [WingtipTests, WingtipUITests]
      # The planner's host, for FlowTests to see whether it answers before
      # driving flows that need it; Xcode fills the build setting in.
      environmentVariables:
        WINGTIP_HOST: $(WINGTIP_HOST)
    archive:
      config: Release
  # The app and its unit tests alone, for a pull request (native-ios.yml's
  # unit_only): -only-testing:WingtipTests on the Wingtip scheme still
  # compiled and linked WingtipUITests (run 42929115521), which no pull
  # request runs. Same targets otherwise, so the DerivedData is shared.
  WingtipUnit:
    build:
      targets:
        Wingtip: all
        WingtipWidgets: all
        WingtipTests: [test]
    test:
      config: Debug
      targets: [WingtipTests]
  # The watch app on its own, for a watch simulator paired with an iPhone
  # one (xcodebuild -destination "platform=watchOS Simulator,name=…");
  # the Wingtip scheme builds it as the app's embedded companion.
  WingtipWatch:
    build:
      targets:
        WingtipWatch: all
        WingtipWatchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [WingtipWatchTests]
