# Every version the native Android app builds with, in one place
# (docs/NATIVE-ANDROID.md), each the newest one on 2026-11-12, a release
# candidate or an alpha where that is the newest (the owner: "use the
# latest libraries and components for each OS even if it's a rc"), each
# checked that day against its own release page: AGP on Google Maven
# (com.android.tools.build:gradle), Kotlin on JetBrains/kotlin's GitHub
# releases (v2.5.0-RC, 2026-11-11), the Compose BOM, Lifecycle, Navigation
# 3 and Activity on Google Maven.
# AGP 9 compiles the Kotlin itself (its built-in Kotlin), so the Kotlin
# Android plugin is not applied; Kotlin's own Compose compiler and
# serialization plugins ride on Kotlin's version; the Compose libraries
# come from the BOM, so they are consistent with each other by
# construction and carry no version of their own here -- all but
# Material 3, below.
[versions]
agp = "9.6.0-alpha03"
kotlin = "2.5.0-RC"
coreKtx = "1.19.1"
activityCompose = "1.14.0-alpha03"
lifecycle = "2.12.0-alpha05"
# Compose's alpha BOM, the newest (2026.11.00): Compose 1.13.0-rc01, and
# Material 3 1.5.0-rc01, the release candidate that makes Material 3
# Expressive public (the owner, 2026-11-09: "Avoid building our own and
# let's use rc01"), and Material's adaptive 1.4.0-alpha03 with its
# Navigation 3 scenes (adaptive-navigation3), so Material 3 is back on the
# BOM and nothing of Compose carries a version of its own here.
composeBom = "2026.11.00"
serialization = "1.13.0"
coroutines = "1.11.0"
okhttp = "5.5.1"
maplibre = "2026.11.2-globe"
material = "1.14.0"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
# The flight pieces (flight/, records/, notify/): the fused location
# provider, Room 3 (androidx.room3) for the records with KSP for its
# compiler (KSP2, whose version is its own since 2.3), DataStore for the
# few switches.
playServicesLocation = "21.4.0"
room3 = "3.0.3"
ksp = "2.3.13"
datastore = "1.3.0"
# The geoid model that turns the GPS's height above the ellipsoid into
# height above mean sea level, for phones below Android 14 (own ship's
# altitude, flight/OwnShip.kt).
coreLocationAltitude = "1.0.1"
# Google's document scanner, for Add from a Photo (documents/).
mlkitDocumentScanner = "16.0.0"
# JankStats, for the frames the app draws and how many came late, sent
# with the diagnostics (diagnostics/FrameStats.kt).
metricsPerformance = "1.0.0"
# WorkManager, for the chart downloads (offline/OfflineWorker.kt): an
# archive fetched with the app in the background or closed.
work = "2.12.0"
# Glance, for the home screen's Next Flight widget (widget/), drawn in
# Material 3's roles from the Wingtip palettes.
glance = "1.2.0"
# Navigation 3, for the sheet's cards and pages (ui/SheetPages.kt's
# NavDisplay over MapViewModel's back stack): its transitions and
# predictive back, and Material's list-detail scene on a wide window. The
# newest release, an alpha (Google Maven, 2026-11-12).
navigation3 = "1.3.0-alpha04"
# AndroidX's SplashScreen, so Android 8 to 11 show the launch's mark as 12
# and later do (res/values/themes.xml).
coreSplashscreen = "1.2.0"
# The app's AI on the phone (docs/android-ai.md), each the newest on Google
# Maven on 2026-11-09. AppFunctions, Android's on-device MCP: the app's
# actions and entities offered to Gemini and the system's agents
# (ai/functions/), its KSP compiler writing the service and its schema;
# the release candidate, the owner's rule for a stock component.
appfunctions = "1.0.0-rc01"
# ML Kit's Prompt API over Gemini Nano (AICore): the words, drafts and the
# on-phone Ask with tools (ai/). Beta, the only release there is; the
# Summarization, Proofreading and Rewriting APIs (1.0.0-beta1, May 2025,
# on an older genai-common) are not used, as the Prompt API does each.
genaiPrompt = "1.0.0-beta5"
# ML Kit text recognition through Play services (no model in the app): a
# photographed page read on the phone before Nano reads its figures.
mlkitTextRecognition = "19.0.2"
# The release build's start (docs/NATIVE-ANDROID.md, "Release build"):
# the Baseline Profile Gradle plugin and Macrobenchmark, one release
# train, 1.5.0 the newest stable on Google Maven on 2026-11-10; UiAutomator
# for the generator's taps (2.4.1, the same day); ProfileInstaller, which
# installs the profile on a phone that did not get it from Play (1.4.1).
# Hilt, the app's dependency injection (the owner, 2026-11-12): Dagger's
# Hilt 2.60.1 (google/dagger's GitHub releases, dagger-2.60.1, the newest
# on 2026-11-12), its compiler through KSP, and AndroidX's Hilt 1.4.0
# (Google Maven) for hiltViewModel in Compose.
hilt = "2.60.1"
androidxHilt = "1.4.0"
benchmark = "1.5.0"
uiautomator = "2.4.1"
profileinstaller = "1.4.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom-alpha", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Material's adaptive panes, the BOM's versions: the search's list and a
# card side by side on a tablet or an unfolded phone, as Navigation 3's
# list-detail scene (ListDetailSceneStrategy).
androidx-compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout" }
androidx-compose-material3-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3" }
# Compose's instrumented tests, and Google's Accessibility Test Framework
# run over a composition's nodes (enableAccessibilityChecks), the BOM's
# versions: the screens' TalkBack labels, roles and touch targets held in
# CI (AccessibilityChecksTest).
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-junit4-accessibility = { group = "androidx.compose.ui", name = "ui-test-junit4-accessibility" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# The core icon set (the location arrow on the map); the BOM sets its version.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# The full icon set, for the sparkle on Ask; R8 keeps only the icons used.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
# MapLibre Native: the open native map, no key and no account, which is
# why it draws the chart rather than Google Maps (docs/NATIVE-ANDROID.md).
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
# Material Components for Android, for the window's theme alone
# (res/values/themes.xml's Theme.Material3 parent); the screens are Compose's.
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
# Google's fused location provider, for own ship (flight/OwnShip.kt): one
# fix a second from GPS with the phone's other sensors, as Core Location
# gives the iPhone's.
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
# Room 3, for the pilot's records on the device (records/Records.kt), the
# twin of the iOS app's SwiftData store: Kotlin-first, its DAOs suspending
# or flows with no ktx artifact, SQLite through a SQLiteDriver, the
# compiler through KSP (Room 3 has no annotation processor).
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
# DataStore preferences, for a flight piece's switches (the traffic layer
# on or off, flight/Traffic.kt), in place of SharedPreferences.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# The process's lifecycle (ProcessLifecycleOwner), for the clock's
# background slowing (flight/Ticker.kt) and whether the app is in front
# (notify/Notifications.kt).
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
# AltitudeConverterCompat: mean-sea-level altitude from the fix's
# ellipsoid height, Android 14's AltitudeConverter brought to older phones.
androidx-core-location-altitude = { group = "androidx.core", name = "core-location-altitude", version.ref = "coreLocationAltitude" }
# ML Kit's document scanner through Play services: the system's own scan
# screen (edges found, the page flattened, a photo picked instead), with
# no camera permission and no model in the app (documents/PageScanner.kt).
play-services-mlkit-document-scanner = { group = "com.google.android.gms", name = "play-services-mlkit-document-scanner", version.ref = "mlkitDocumentScanner" }
# JankStats: each frame's time and whether it was janky, on the activity's
# window (diagnostics/FrameStats.kt).
androidx-metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "metricsPerformance" }
androidx-appfunctions = { group = "androidx.appfunctions", name = "appfunctions", version.ref = "appfunctions" }
androidx-appfunctions-compiler = { group = "androidx.appfunctions", name = "appfunctions-compiler", version.ref = "appfunctions" }
mlkit-genai-prompt = { group = "com.google.mlkit", name = "genai-prompt", version.ref = "genaiPrompt" }
play-services-mlkit-text-recognition = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition", version.ref = "mlkitTextRecognition" }
# Play services' Task awaited in a coroutine (the text recognizer's answer).
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
