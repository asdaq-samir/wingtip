# Every version the native Android app builds with, in one place
# (docs/NATIVE-ANDROID.md), each the newest stable one on 2026-11-09.
# AGP 9 compiles the Kotlin itself (its built-in Kotlin), so the Kotlin
# Android plugin is not applied; Kotlin's own Compose compiler and
# serialization plugins ride on Kotlin's version; the Compose libraries
# come from the BOM, so they are consistent with each other by
# construction and carry no version of their own here -- all but
# Material 3, below.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
# Material 3 off the BOM, at the release candidate that makes Material 3
# Expressive public (the owner, 2026-11-09: "Avoid building our own and
# let's use rc01"): the expressive motion scheme, button groups, floating
# toolbars, the loading indicator, the buttons' press shapes and the
# emphasized type roles, all of which 1.4.0 (the BOM's) keeps internal.
# It needs Compose 1.12.0's foundation, ui and animation, which the BOM's
# 1.12.1 already is, so nothing else leaves the BOM. Bump to 1.5.0
# stable when it is released (docs/NATIVE-ANDROID.md).
material3 = "1.5.0-rc01"
serialization = "1.12.0"
coroutines = "1.11.0"
okhttp = "5.5.1"
maplibre = "13.7.1"
material = "1.14.0"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
# The flight pieces (flight/, records/, notify/): the fused location
# provider, Room for the records with KSP for its compiler (KSP2, whose
# version is its own since 2.3), DataStore for the few switches.
playServicesLocation = "21.4.0"
room = "2.8.5"
ksp = "2.3.13"
datastore = "1.3.0"
# The geoid model that turns the GPS's height above the ellipsoid into
# height above mean sea level, for phones below Android 14 (own ship's
# altitude, flight/OwnShip.kt).
coreLocationAltitude = "1.0.1"
# Google's document scanner, for Add from a Photo (documents/).
mlkitDocumentScanner = "16.0.0"
# JankStats, for the frames the app draws and how many came late, sent
# with the diagnostics (diagnostics/FrameStats.kt).
metricsPerformance = "1.0.0"
# WorkManager, for the chart downloads (offline/OfflineWorker.kt): an
# archive fetched with the app in the background or closed.
work = "2.12.0"
# Glance, for the home screen's Next Flight widget (widget/), drawn in
# Material 3's roles from the Wingtip palettes.
glance = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
# Compose's instrumented tests, and Google's Accessibility Test Framework
# run over a composition's nodes (enableAccessibilityChecks), the BOM's
# versions: the screens' TalkBack labels, roles and touch targets held in
# CI (AccessibilityChecksTest).
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-junit4-accessibility = { group = "androidx.compose.ui", name = "ui-test-junit4-accessibility" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# The core icon set (the location arrow on the map); the BOM sets its version.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# The full icon set, for the sparkle on Ask; R8 keeps only the icons used.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
# MapLibre Native: the open native map, no key and no account, which is
# why it draws the chart rather than Google Maps (docs/NATIVE-ANDROID.md).
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
# Material Components for Android, for the window's theme alone
# (res/values/themes.xml's Theme.Material3 parent); the screens are Compose's.
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
# Google's fused location provider, for own ship (flight/OwnShip.kt): one
# fix a second from GPS with the phone's other sensors, as Core Location
# gives the iPhone's.
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
# Room, for the pilot's records on the device (records/Records.kt), the
# twin of the iOS app's SwiftData store; ktx for its suspending DAO and
# flows, the compiler through KSP.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# DataStore preferences, for a flight piece's switches (the traffic layer
# on or off, flight/Traffic.kt), in place of SharedPreferences.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# The process's lifecycle (ProcessLifecycleOwner), for the clock's
# background slowing (flight/Ticker.kt) and whether the app is in front
# (notify/Notifications.kt).
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
# AltitudeConverterCompat: mean-sea-level altitude from the fix's
# ellipsoid height, Android 14's AltitudeConverter brought to older phones.
androidx-core-location-altitude = { group = "androidx.core", name = "core-location-altitude", version.ref = "coreLocationAltitude" }
# ML Kit's document scanner through Play services: the system's own scan
# screen (edges found, the page flattened, a photo picked instead), with
# no camera permission and no model in the app (documents/PageScanner.kt).
play-services-mlkit-document-scanner = { group = "com.google.android.gms", name = "play-services-mlkit-document-scanner", version.ref = "mlkitDocumentScanner" }
# JankStats: each frame's time and whether it was janky, on the activity's
# window (diagnostics/FrameStats.kt).
androidx-metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "metricsPerformance" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
