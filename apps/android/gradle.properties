# Gradle's memory for the build: the Kotlin and Compose compilers and the
# Android plugin together want more than the default, and the runner has it.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# AndroidX, which every library here is; the old support library is not
# brought in beside it.
android.useAndroidX=true
# Each module's R class holds only its own resources, so a resource is
# named by the module that owns it and the build stays small.
android.nonTransitiveRClass=true
# The official Kotlin code style, which the Kotlin plugin otherwise asks for.
kotlin.code.style=official
# A Gradle deprecation fails the build, as a Kotlin or lint warning
# does, so the build is moved to the current API when one comes in.
org.gradle.warning.mode=fail
# Gradle's build cache, in ~/.gradle/caches/build-cache-1 (Gradle's own
# default, which Gradle prunes of entries unused for a week): a task whose
# inputs another worktree's build already had takes that build's outputs
# (FROM-CACHE) instead of running, so an agent's fresh worktree compiles
# only what it changed (the owner, 2026-11-10: "share resources"). The
# configuration cache keeps the task graph between runs of one worktree.
org.gradle.caching=true
org.gradle.configuration-cache=true
