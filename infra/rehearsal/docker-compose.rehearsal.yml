# The production stack, rehearsed on this machine before anything goes to
# AWS: infra/docker-compose.prod.yml as the server runs it -- the images CI
# would push, no source mounted, Caddy demanding CloudFront's secret
# header -- with stand-ins for the three things only AWS has:
#
# - cdn: CloudFront. Serves /tiles/* from a local chart pyramid, as the
#   S3 bucket would, and sends everything else to the origin Caddy over
#   HTTPS with the secret header and the origin's own name, as CloudFront
#   does (infra/cloudformation/template.yaml). Its HTTPS is Caddy's own
#   local certificate authority, so a browser is told to accept it.
# - mailpit: Amazon SES, for the sign-in links.
# - the server's /srv/wingtip/data: REHEARSAL_DIR/data, a folder of
#   its own, empty at first but for deploy.sh's seeds, so the planner
#   fetches its FAA data the way a new server does.
#
# infra/rehearsal/run.sh builds the images, writes the .env and starts it
# (docs/README-AWS.md, "Rehearse it locally").

services:
  # Logs to the machine's own Docker, not CloudWatch (every service
  # below): there is no AWS here.
  caddy:
    # Only the CDN reaches it, over this stack's own network.
    ports: !reset []
    logging: !override { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  db:
    logging: !override { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    # A volume, as in the development stack, rather than a folder of
    # this machine's.
    volumes: !override
      - postgres:/var/lib/postgresql

  planner:
    logging: !override { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    volumes: !override
      - ${REHEARSAL_DIR:?}/data:/workspace/data
      - ../data/aircraft:/workspace/data/aircraft:ro

  ingest:
    logging: !override { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    volumes: !override
      - ${REHEARSAL_DIR:?}/data:/workspace/data

  weather:
    logging: !override { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    volumes: !override
      - ${REHEARSAL_DIR:?}/data:/workspace/data

  gateway:
    logging: !override { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    environment:
      # The browser suite signs in more often in a run than a pilot does
      # in an hour (docker-compose.yml loosens the same).
      APP_MAGIC_LINK_PER_ADDRESS_PER_HOUR: "60"
      APP_MAGIC_LINK_PER_CLIENT_PER_HOUR: "200"

  cdn:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    ports: ["127.0.0.1:9443:9443"]
    environment:
      ORIGIN_HOST: ${ORIGIN_HOST}
      ORIGIN_SECRET: ${ORIGIN_SECRET:?}
    volumes:
      - ./rehearsal/Caddyfile.cdn:/etc/caddy/Caddyfile:ro
      - ${TILES_DIR:?}:/srv/tiles:ro
      - cdn-data:/data
    depends_on: [caddy]

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    restart: unless-stopped
    ports: ["127.0.0.1:9025:8025"]
    environment:
      MP_ALLOWED_HOSTS: localhost,mailpit
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  cdn-data:
  postgres:
