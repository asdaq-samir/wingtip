AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Wingtip Maps' edge: what CloudFront takes only from us-east-1, the
  certificate for the app's domain and, with EdgeRateLimit=on, the WAF
  web ACL of rate limits. Deploy it in us-east-1 first and pass its
  outputs to template.yaml, deployed in any Region (decision 0064,
  docs/README-AWS.md "The first deploy"). An AWS project account (the
  new AWS experience) may not run CloudFormation in us-east-1; there the
  certificate is requested with the AWS CLI instead, as README-AWS.md
  says, and the web ACL waits for the account's advanced features.

Parameters:
  PublicHost:
    Type: String
    Description: The app's domain, e.g. app.example.com, as template.yaml's PublicHost.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 zone the domain lives in, for the certificate's DNS validation.
  EdgeRateLimit:
    Type: String
    Default: "off"
    AllowedValues: ["on", "off"]
    Description: >-
      The AWS WAF web ACL for the distribution (TileRateLimit, about $7.20 a month):
      "on" answers 429 to an address past 3,000 tile requests, or 3,000 other planner
      requests, in five minutes. Off at launch (the owner, 2026-11-27, decision 0063);
      turned on if the server's load or the tile requests show abuse, its WebAclArn
      output then passed to template.yaml.

Rules:
  UsEast1:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: Deploy in us-east-1, the one Region CloudFront takes a certificate and a web ACL from.

Conditions:
  EdgeRateLimitOn: !Equals [!Ref EdgeRateLimit, "on"]

Resources:
  # CloudFront's certificate, renewed by ACM itself while its DNS record
  # stands (the record is this stack's, so it stays as long as it does).
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref PublicHost
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref PublicHost
          HostedZoneId: !Ref HostedZoneId

  # A rate rule on the tile paths that reach the server (the deep
  # security review of 2026-11-21, N5). A tile's address with a ?c= or ?r=
  # of its own is a cache miss, so a loop of them made every tile the
  # planner's to read on the server's two cores. Past 3,000 tile requests
  # in five minutes from one address (10 a second, held), that address is
  # answered 429 at the edge until it slows. A pilot asks far fewer: a
  # session is some 200 tiles, the web's service worker keeps 20,000 for
  # the cycle and the phones their own cache, and a whole screen at 2x is
  # about 40. Counted before the cache, so a hit counts too; an airport's
  # shared Wi-Fi of ten pilots panning at once stays under it. CLOUDFRONT
  # scope, which AWS takes only in us-east-1, hence this stack (decision
  # 0064). Its cost, about $7 a month and $0.60 a million requests, is in
  # docs/README-AWS.md. Made only with EdgeRateLimit=on:
  # off at launch, the owner's choice of 2026-11-27 (decision 0063), which
  # leaves N5 and M4 open until it is turned on.
  TileRateLimit:
    Type: AWS::WAFv2::WebACL
    Condition: EdgeRateLimitOn
    Properties:
      Name: !Sub "${AWS::StackName}-tiles"
      Description: Rate limits on the tile paths of the planner and its other paths, everything else let through.
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-waf"
        SampledRequestsEnabled: true
      CustomResponseBodies:
        slow-down:
          ContentType: TEXT_PLAIN
          Content: Too many tile requests from this address. Try again in a few minutes.
        slow-down-planner:
          ContentType: TEXT_PLAIN
          Content: Too many requests to the planner from this address. Try again in a few minutes.
      Rules:
        - Name: tiles-per-address
          Priority: 0
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: slow-down
                ResponseHeaders: [{ Name: Retry-After, Value: "60" }]
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-tiles-per-address"
            SampledRequestsEnabled: true
          Statement:
            RateBasedStatement:
              Limit: 3000
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/planner/chart-tile/
                        TextTransformations: [{ Priority: 0, Type: NONE }]
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/planner/terrain-tile/
                        TextTransformations: [{ Priority: 0, Type: NONE }]
        # Every other planner path, anonymous ones among them: a plan,
        # nav log or ForeFlight pack starts a corridor read per new pair of
        # airports, the FAA PDFs and diagrams miss the cache with a query
        # string of the caller's own, and the overlay tiles reach the
        # planner through Caddy. The tile rule above held only the two tile
        # paths (round 4's security review, M4; the owner took the
        # recommendation, a second rule at about $1 a month). The same
        # 3,000 in five minutes from one address, the tiles left to their
        # own count: a pilot planning asks some tens a route, the overlay
        # tiles of a whole screen some 40.
        - Name: planner-per-address
          Priority: 1
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: slow-down-planner
                ResponseHeaders: [{ Name: Retry-After, Value: "60" }]
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-planner-per-address"
            SampledRequestsEnabled: true
          Statement:
            RateBasedStatement:
              Limit: 3000
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: STARTS_WITH
                        SearchString: /api/planner/
                        TextTransformations: [{ Priority: 0, Type: NONE }]
                    - NotStatement:
                        Statement:
                          ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: /api/planner/chart-tile/
                            TextTransformations: [{ Priority: 0, Type: NONE }]
                    - NotStatement:
                        Statement:
                          ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: /api/planner/terrain-tile/
                            TextTransformations: [{ Priority: 0, Type: NONE }]

Outputs:
  CertificateArn:
    Description: template.yaml's CertificateArn.
    Value: !Ref Certificate
  WebAclArn:
    Condition: EdgeRateLimitOn
    Description: template.yaml's WebAclArn, with EdgeRateLimit=on.
    Value: !GetAtt TileRateLimit.Arn
