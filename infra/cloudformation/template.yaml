AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Wingtip Maps on AWS, built for low cost: one EC2 server (gateway, planner, ingest,
  Postgres) behind CloudFront, FAA chart tiles drawn once
  per 56-day cycle by a Fargate Spot task into S3, and the web app's
  fingerprinted files cached at the edge. About $41 a month with the
  server on Spot capacity, the default (docs/README-AWS.md has the
  itemised cost and the runbook). Deploy in any Region (us-east-2 for an
  AWS project account); CloudFront's certificate and its WAF web ACL are
  made in us-east-1 first, by edge.yaml or the AWS CLI, and passed in as
  CertificateArn and WebAclArn (decision 0064).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Domain }
        Parameters: [PublicHost, HostedZoneId, CertificateArn, WebAclArn, MailDomain]
      - Label: { default: Server }
        Parameters: [ServerPricing, ServerImageId, InstanceType, SpareInstanceType, DataVolumeGb, ImageTag, CloudFrontPrefixListId]
      - Label: { default: Deploys from GitHub }
        Parameters: [GitHubRepo, CreateGitHubOidcProvider]
      - Label: { default: Spending }
        Parameters: [BudgetEmail]

Parameters:
  PublicHost:
    Type: String
    Description: The app's domain, e.g. app.example.com. Its Route 53 zone must be HostedZoneId.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The Route 53 zone the domain lives in (for the DNS records and SES's DKIM).
  CertificateArn:
    Type: String
    AllowedPattern: "^arn:aws:acm:us-east-1:[0-9]{12}:certificate/.+$"
    ConstraintDescription: an ACM certificate in us-east-1, the one Region CloudFront takes one from.
    Description: >
      The ACM certificate for PublicHost, in us-east-1: edge.yaml's
      CertificateArn output, or on an AWS project account the one the
      AWS CLI requests (docs/README-AWS.md, "The first deploy").
  WebAclArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:wafv2:us-east-1:[0-9]{12}:global/webacl/.+$"
    ConstraintDescription: empty, or a CLOUDFRONT-scope web ACL (us-east-1).
    Description: >
      Empty, the default: no web ACL on the distribution, the edge's rate
      limit off at launch (the owner, 2026-11-27, decision 0063). Turned
      on by deploying edge.yaml with EdgeRateLimit=on and passing its
      WebAclArn output here (about $7.20 a month).
  MailDomain:
    Type: String
    Default: ""
    Description: The domain sign-in mail is sent from (no-reply@MailDomain). Empty means PublicHost.
  ServerImageId:
    Type: AWS::EC2::Image::Id
    Description: >
      The server's Amazon Linux 2023 image (x86_64), named here rather
      than looked up, so the server changes only when this does (a new
      one replaces the server; the data disk moves to the next). The
      current one: aws ssm get-parameter --region <the stack's Region> --name
      /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
      --query Parameter.Value --output text
  ServerPricing:
    Type: String
    Default: spot
    AllowedValues: [spot, on-demand]
    Description: >
      spot: AWS's spare capacity, about a third of the price; a few times a
      year AWS takes it back, and a new server starts on the same data disk
      within minutes. on-demand: never taken back. Changing it replaces the
      server, keeping the data disk. An AWS project account (the new AWS
      experience) denies Spot (its managed policy's DenySpotMarketType and
      DenyRequestSpotInstances) until its advanced features are activated
      and those policies changed: deploy there with on-demand.
  InstanceType:
    Type: String
    Default: t3a.large
    AllowedValues: [t3a.medium, t3a.large, t3.medium, t3.large, m6a.large, m7a.large]
    Description: >
      2 cores and 8 GB. The services' limits add up to about 3.5 GB
      (weather 768 MB, ingest 384 MB, the gateway's JVM, the planner,
      Postgres; the prelaunch audit, 2026-11-21), which a medium's 4 GB
      barely holds, so the launch size is a large (the owner, 2026-11-21).
      x86, so CI's images run as built.
  SpareInstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3a.medium, t3a.large, t3.medium, t3.large, m6a.large, m7a.large]
    Description: >
      A second type of the same size, for when Spot has none of the first:
      two pools are interrupted less often than one.
  DataVolumeGb:
    Type: Number
    Default: 30
    MinValue: 20
    Description: >
      The data disk, which outlives any one server: Postgres, the FAA data
      and the chart sheets the planner reads checkpoints off (6 GB for the
      whole country), the checkpoint notes. gp3 grows in place if it fills.
      The server's own 20 GB disk holds the system, the images and swap.
  ImageTag:
    Type: String
    Default: latest
  CloudFrontPrefixListId:
    Type: String
    Default: pl-b6a144df
    Description: >
      CloudFront's origin-facing managed prefix list in the stack's Region,
      whose ID differs by Region: the default is us-east-2's (us-east-1's
      is pl-3b927c52). Check it with: aws ec2 describe-managed-prefix-lists
      --region <the stack's Region> --filters
      Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
      --query 'PrefixLists[0].PrefixListId' --output text
  GitHubRepo:
    Type: String
    Default: asdaq-samir/wingtip
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false", "none"]
    Description: >
      false if the account already has token.actions.githubusercontent.com
      as an OIDC provider. none makes neither the provider nor the deploy
      role, for an AWS project account, whose managed policy denies making
      a provider (DenyIAMRestrictedActions, iam:*Provider*) until its
      advanced features are activated: deploys then go by hand.
  BudgetEmail:
    Type: String
    Default: ""
    Description: Where the monthly budget alarm ($50, at 80% spent) and a failed nightly backup go. Empty for no alarm.

Conditions:
  HasBudget: !Not [!Equals [!Ref BudgetEmail, ""]]
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  HasDeployRole: !Not [!Equals [!Ref CreateGitHubOidcProvider, "none"]]
  HasMailDomain: !Not [!Equals [!Ref MailDomain, ""]]
  SpotServer: !Equals [!Ref ServerPricing, spot]
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]
  # Route 53's health check figures and ACM's events for CloudFront's
  # certificate reach CloudWatch and EventBridge in us-east-1 alone, so
  # their alarm and rule are made only in a stack there; an AWS project
  # account may not make either in us-east-1 (decision 0064).
  InUsEast1: !Equals [!Ref AWS::Region, us-east-1]
  UsEast1Alerts: !And [!Condition HasBudget, !Condition InUsEast1]

Resources:
  # ---------------------------------------------------------------------
  # Network: one public subnet. The server and the refresh task reach the
  # FAA, NOAA and AWS's own APIs directly, so there is no NAT
  # gateway ($33 a month) and no VPC endpoints ($7 each).
  # ---------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ---------------------------------------------------------------------
  # Images: the five the server runs and the charts job's (the refresh
  # task's, and the server's hourly overlays), pushed by promote.yml's
  # push-ecr.
  # ---------------------------------------------------------------------
  GatewayRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: wingtip/gateway
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 20","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  PlannerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: wingtip/planner
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 20","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  # The live feeds (services/ingest), split from the planner (#535): a
  # container of its own on the same server, sharing its data disk.
  IngestRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: wingtip/ingest
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 20","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  # The weather service (services/weather), which fetches the weather the
  # planner reads into the store on the data disk.
  WeatherRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: wingtip/weather
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 20","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  # The charts job (services/jobs/charts): the refresh task's image, and
  # the server's hourly overlays.
  ChartsRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: wingtip/charts
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 20","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  # ---------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------
  ChartTilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # A cycle's archives age out after the next two cycles have come:
          # a planner on an old serving.json for its minute still finds
          # them, and an archive packed again (published under a new name)
          # leaves the old one to this.
          - Id: OldCycles
            Status: Enabled
            Prefix: tiles/
            ExpirationInDays: 120

  # The nightly backups (backups/, kept 14 days), the ground grid a
  # server builds once (ground_grid/) and the chart model the planner
  # ranks checkpoints with (models/, uploaded by hand). Kept if the stack
  # goes: it is what a new server is restored from. Versioned, so a
  # server that is compromised, or a deploy gone wrong, cannot destroy a
  # backup by writing over it or deleting it: the old copy stays a
  # noncurrent version for 30 days, which is how long there is to notice.
  ServerBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: NightlyBackups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 14
          - Id: OverwrittenAndDeleted
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            # A delete leaves only a marker once its versions are gone.
            ExpiredObjectDeleteMarker: true

  # ---------------------------------------------------------------------
  # Secrets: four the stack generates, one the owner fills in
  # (infra/server/env.example). deploy.sh reads all five.
  # ---------------------------------------------------------------------
  DbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Postgres password of the database's owner on the server, which Flyway signs in as.
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  # The gateway's own role, which may read and write rows and nothing else
  # (db/callback/afterMigrate.sql; docs/SECURITY.md, N4). Letters and
  # digits only: the callback quotes it into its ALTER ROLE.
  AppDbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Postgres password of the gateway's DML-only role (wingtip_app) on the server.
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true }

  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: The header CloudFront sends and Caddy demands, so only CloudFront reaches the server.
      GenerateSecretString: { PasswordLength: 40, ExcludePunctuation: true }

  # The key the planner hashes each pilot's share of the followed airplanes
  # with (FOLLOW_SHARE_KEY, wingtip.traffic.recorded): kept here, never in
  # the live store beside the shares it hashes (the round 7 audit, P-M1).
  FollowShareKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: The key the planner hashes each pilot's share of the followed airplanes with (FOLLOW_SHARE_KEY).
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }

  # Its keys only: the owner fills in the values in the console, and the
  # stack never writes it again unless this SecretString changes -- so
  # leave it as it is.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: The owner's own values (infra/server/env.example). Fill in, then run deploy.sh.
      SecretString: '{"MAIL_USERNAME":"","MAIL_PASSWORD":"","APP_DEVELOPER_EMAILS":""}'

  # ---------------------------------------------------------------------
  # The server
  # ---------------------------------------------------------------------
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from CloudFront only, HTTP from anywhere for the Lets Encrypt challenge (Caddy redirects the rest).
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, SourcePrefixListId: !Ref CloudFrontPrefixListId }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: The server's own permissions -- pull its images, read its secrets, write its backups. Shell access through SSM, no SSH.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: Server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource:
                  - !GetAtt GatewayRepository.Arn
                  - !GetAtt PlannerRepository.Arn
                  - !GetAtt IngestRepository.Arn
                  - !GetAtt WeatherRepository.Arn
                  - !GetAtt ChartsRepository.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DbPasswordSecret, !Ref AppDbPasswordSecret, !Ref OriginSecret, !Ref FollowShareKeySecret, !Ref AppSecret]
              # Reads anything (models/ comes from the owner); writes only
              # where it keeps things: backup.sh's backups/ and the ground
              # grid deploy.sh builds once (ground_grid/). So a server
              # cannot replace the chart model the next server loads.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ServerBucket.Arn}/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub "${ServerBucket.Arn}/backups/*"
                  - !Sub "${ServerBucket.Arn}/ground_grid/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ServerBucket.Arn
              - !If
                - HasBudget
                - { Effect: Allow, Action: "sns:Publish", Resource: !Ref BackupAlertTopic }
                - !Ref AWS::NoValue
              # Its services' logs, to CloudWatch (infra/docker-compose.prod.yml).
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ServerLogGroup.Arn
              # Its own checks' figures (infra/server/health.sh), in the
              # Wingtip namespace alone; PutMetricData takes no resource.
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    "cloudwatch:namespace": Wingtip
              # Each new server takes over the stack's address and data disk.
              # The volume and the address are the stack's own; an instance
              # is allowed only if it carries the stack's server Name tag
              # (the launch template sets it), so a compromised server
              # cannot attach the disk to, or move the address onto, any
              # other instance. A condition on a tag applies to every
              # resource in its statement, so each kind has its own.
              - Effect: Allow
                Action: ec2:AttachVolume
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/${DataVolume}"
              - Effect: Allow
                Action: ec2:AssociateAddress
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/${ServerAddress.AllocationId}"
              - Effect: Allow
                Action: [ec2:AttachVolume, ec2:AssociateAddress]
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "ec2:ResourceTag/Name": !Sub "${AWS::StackName}-server"
              # AssociateAddress also names the instance's network interface,
              # which has no tag to match on.
              - Effect: Allow
                Action: ec2:AssociateAddress
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"

  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ServerRole]

  # The data disk: everything the server keeps -- Postgres, the planner's
  # data folder and checkpoint notes, the repository -- on a disk of its
  # own that outlives any one server. Each new server attaches it on its
  # first boot (the launch template's UserData); a snapshot is taken if
  # the stack is ever deleted, and SnapshotPolicy takes one daily.
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt PublicSubnet.AvailabilityZone
      Size: !Ref DataVolumeGb
      VolumeType: gp3
      Encrypted: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-data" }
        - { Key: Snapshot, Value: !Sub "${AWS::StackName}-daily" }

  ServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref ServerImageId
        IamInstanceProfile: { Arn: !GetAtt ServerInstanceProfile.Arn }
        SecurityGroupIds: [!Ref ServerSecurityGroup]
        # One hop: the server itself reaches the instance's metadata (deploy.sh,
        # backup.sh, the awslogs driver in dockerd), its containers, a hop
        # further behind Docker's bridge, do not. None of them asks AWS for
        # anything (the planner reads the tiles through CloudFront), and code
        # run in one of them -- a PDF or GeoTIFF parser's bug, a dependency --
        # would otherwise have the server role's keys: every secret and every
        # backup (the deep security review of 2026-11-21).
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 1 }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeType: gp3, VolumeSize: 20, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-server" }]
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              # Each server's first boot: the stack's address and data disk,
              # Docker, the repo's production files, the settings deploy.sh
              # reads, and the nightly backup. A Spot interruption, or a change
              # that replaces the server, starts a new one, which runs this
              # again and finds the data disk as the last one left it.
              set -euxo pipefail
              token=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 600")
              iid=$(curl -fsS -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/instance-id)
              aws ec2 associate-address --region ${AWS::Region} --allocation-id ${ServerAddress.AllocationId} --instance-id "$iid" --allow-reassociation
              # The disk is free once the last server has gone; until then, wait.
              until aws ec2 attach-volume --region ${AWS::Region} --volume-id ${DataVolume} --instance-id "$iid" --device /dev/sdf; do sleep 10; done
              disk=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$(echo ${DataVolume} | tr -d -)
              until [ -e "$disk" ]; do sleep 2; done
              # Formatted only when blkid positively finds no filesystem (exit
              # 2); any other failure stops the script rather than risk
              # wiping Postgres, and a disk that has one is mounted as it is.
              probe=0
              blkid -p "$disk" > /dev/null || probe=$?
              if [ "$probe" -eq 2 ]; then
                mkfs.xfs "$disk"
              elif [ "$probe" -ne 0 ]; then
                echo "blkid failed ($probe) on $disk: not formatting" >&2
                exit 1
              fi
              mkdir -p /srv/wingtip
              echo "UUID=$(blkid -s UUID -o value "$disk") /srv/wingtip xfs defaults,nofail 0 2" >> /etc/fstab
              mount /srv/wingtip
              # logrotate keeps the cron jobs' logs (deploy.sh's
              # /etc/logrotate.d/wingtip); openssl reads the origin's
              # certificate for health.sh.
              dnf install -y docker git cronie logrotate openssl
              systemctl enable --now docker crond logrotate.timer
              mkdir -p /usr/local/lib/docker/cli-plugins
              # A pinned release, checked against the checksum published
              # beside it, so a rebuild gets the plugin the first boot did.
              compose_url=https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64
              curl -fsSL "$compose_url" -o /usr/local/lib/docker/cli-plugins/docker-compose
              echo "$(curl -fsSL "$compose_url.sha256" | cut -d' ' -f1)  /usr/local/lib/docker/cli-plugins/docker-compose" | sha256sum -c -
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              # 2 GB of swap: headroom for a JVM and a planner on 4 GB.
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
                echo '/swapfile none swap sw 0 0' >> /etc/fstab
              fi
              cat > /etc/wingtip.conf <<'CONF'
              AWS_REGION=${AWS::Region}
              IMAGE_REGISTRY=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/wingtip
              IMAGE_TAG=${ImageTag}
              PUBLIC_HOST=${PublicHost}
              ORIGIN_HOST=origin.${PublicHost}
              SERVER_BUCKET=${ServerBucket}
              APP_SECRET_ARN=${AppSecret}
              DB_SECRET_ARN=${DbPasswordSecret}
              APP_DB_SECRET_ARN=${AppDbPasswordSecret}
              ORIGIN_SECRET_ARN=${OriginSecret}
              FOLLOW_SHARE_KEY_SECRET_ARN=${FollowShareKeySecret}
              BACKUP_TOPIC_ARN=${BackupTopicArn}
              LOG_GROUP=${ServerLogGroup}
              MAIL_HOST=email-smtp.${AWS::Region}.amazonaws.com
              MAIL_FROM=no-reply@${MailFrom}
              CONF
              mkdir -p /srv/wingtip/data /srv/wingtip/postgres
              chown 1000:1000 /srv/wingtip/data
              [ -d /srv/wingtip/repo ] || git clone --depth 1 https://github.com/${GitHubRepo}.git /srv/wingtip/repo
              echo '17 7 * * * root /srv/wingtip/repo/infra/server/backup.sh >> /var/log/wingtip-backup.log 2>&1' \
                > /etc/cron.d/wingtip-backup
              # The images arrive with the first promote.yml push to ECR; until
              # then this fails, and deploy.sh is run again after that push.
              /srv/wingtip/repo/infra/server/deploy.sh || echo "no images yet: run deploy.sh after the first push"
            - MailFrom: !If [HasMailDomain, !Ref MailDomain, !Ref PublicHost]
              BackupTopicArn: !If [HasBudget, !Ref BackupAlertTopic, ""]

  # One server at a time, kept running: if AWS takes a Spot server back,
  # or it fails its checks, the group starts another, which takes over
  # the address and the data disk. Spot from whichever of the two types
  # has the most spare capacity at the price (price-capacity-optimized);
  # on-demand when ServerPricing says so. A new launch template (a new
  # image, say) replaces the server the same way.
  ServerGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: PublicDefaultRoute
    UpdatePolicy:
      AutoScalingRollingUpdate: { MinInstancesInService: 0, MaxBatchSize: 1, PauseTime: PT0S }
    Properties:
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier: [!Ref PublicSubnet]
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandBaseCapacity: !If [SpotServer, 0, 1]
          OnDemandPercentageAboveBaseCapacity: !If [SpotServer, 0, 100]
          SpotAllocationStrategy: price-capacity-optimized
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref ServerLaunchTemplate
            Version: !GetAtt ServerLaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: !Ref InstanceType
            - InstanceType: !Ref SpareInstanceType

  # Daily snapshots of the data disk, 7 kept (about $1 a month): a lost
  # disk does not mean restoring from a nightly dump alone.
  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets Data Lifecycle Manager snapshot the server's data disk.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: dlm.amazonaws.com }, Action: "sts:AssumeRole" }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: Daily snapshots of the Wingtip Maps data disk
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [VOLUME]
        TargetTags: [{ Key: Snapshot, Value: !Sub "${AWS::StackName}-daily" }]
        Schedules:
          - Name: daily
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ["05:00"] }
            RetainRule: { Count: 7 }
            CopyTags: true

  # Every service's log on the server, the pilots' error reports among
  # them (ClientErrorController), kept a month.
  ServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/server"
      RetentionInDays: 30

  # The server's fixed address, taken over by each new server on boot.
  ServerAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # ---------------------------------------------------------------------
  # Domain: the public name on CloudFront (its certificate, CertificateArn,
  # is made in us-east-1: edge.yaml), and origin.<domain> on the server
  # for Caddy's own Let's Encrypt certificate.
  # ---------------------------------------------------------------------
  OriginRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "origin.${PublicHost}"
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ServerAddress]

  PublicRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref PublicHost
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront's own zone, the same for every distribution

  PublicRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref PublicHost
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ---------------------------------------------------------------------
  # CloudFront: one distribution on the app's domain.
  # - /tiles/*       S3, the chart cycle: serving.json, and one PMTiles
  #                  archive per kind and density (wingtip.tile_archive),
  #                  which the planner reads a tile at a time by range
  #                  requests; a month at the edge (each its own immutable
  #                  Cache-Control, its contents in its name).
  # - /api/planner/chart-tile/*, terrain-tile/*, overlay-tiles*
  #                  the server, cached a year at most (TilesCachePolicy):
  #                  a tile the planner read out of its archive, its cycle
  #                  and revision in its address. Caddy sends these to the
  #                  planner itself, not through the gateway
  #                  (infra/server/Caddyfile, @tiles).
  # - /app/assets/*  the server, cached: fingerprinted, a year, immutable
  #                  (WebMvcConfig's own header). CachingOptimized keys on
  #                  Brotli and gzip, so the origin sends the web build's
  #                  own .br (Brotli at 11) to a viewer that takes it.
  # - the chart, the airport search, the stock aircraft
  #                  the server, cached by their own Cache-Control: the
  #                  same for every pilot (SharedAnswersCachePolicy).
  # - everything else the server, not cached: the app's pages, the API,
  #                  sign-in -- cookies and query strings go through.
  # One domain for all of it, so the session's Secure cookies work as
  # they do locally and the map's tile fetches are same-origin.
  # ---------------------------------------------------------------------
  TilesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-tiles"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ChartTilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ChartTilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${ChartTilesBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          # TLS only, whoever asks (AWS's S3 security best practices).
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ChartTilesBucket.Arn, !Sub "${ChartTilesBucket.Arn}/*"]
            Condition:
              Bool: { aws:SecureTransport: "false" }

  # The backups and the model only over TLS: nothing grants a reader here
  # but the roles, and this keeps any of them, or a script, from asking in
  # the clear (the deep security review of 2026-11-21).
  ServerBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ServerBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ServerBucket.Arn, !Sub "${ServerBucket.Arn}/*"]
            Condition:
              Bool: { aws:SecureTransport: "false" }

  # The answers the same for every pilot (the planner's routes marked
  # SHARED in app.gateway, the airport diagrams among them; app.router_basics'
  # SHARED_CACHE, CHART_CACHE and DIAGRAM_CACHE):
  # kept for as long as their own Cache-Control says, a day at most, and
  # not at all when they say nothing. Keyed by path and query string alone
  # -- no cookie, no header -- so one pilot's search answers the next; and
  # nothing else goes to the server either, so no Set-Cookie can be kept
  # and handed on (CloudFront drops it where no cookie is forwarded).
  SharedAnswersCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-shared-answers"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: { HeaderBehavior: none }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

  # The map's tiles: the chart's, the terrain's and the overlays' archive.
  # The planner says how long each is good for -- a year and immutable
  # where the address names the cycle and revision (?c= and ?r=), else
  # half a cycle -- and this keeps them that long, where
  # SharedAnswersCachePolicy stops at a day: a chart tile changes only
  # with its address, so a day's ceiling only sent the edge back to the
  # server for the same bytes. Keyed by the path and those two query
  # strings alone, so an address with anything else on it is the same
  # tile; no cookie and no header goes to the origin, and no encoding is
  # asked (rasters, and an archive read in byte ranges).
  TilesCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-tiles"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig: { HeaderBehavior: none }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings: [c, r]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        Comment: !Sub "Wingtip Maps (${AWS::StackName})"
        Aliases: [!Ref PublicHost]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        # North America and Europe: where the pilots are, and the cheapest edges.
        PriceClass: PriceClass_100
        Origins:
          - Id: tiles
            DomainName: !GetAtt ChartTilesBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt TilesOriginAccessControl.Id
          - Id: server
            DomainName: !Sub "origin.${PublicHost}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Secret
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginSecret}:SecretString}}"
        DefaultCacheBehavior:
          TargetOriginId: server
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # managed CachingDisabled
          # Managed AllViewerExceptHostHeader: every header, cookie and
          # query string, but Host -- CloudFront then names
          # origin.<domain>, the name Caddy holds a certificate for, and
          # Caddy tells the gateway the public one.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CacheBehaviors:
          - PathPattern: tiles/*
            TargetOriginId: tiles
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false  # archives read in byte ranges: a compressed answer would not be their bytes
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # managed CachingOptimized
          # The map's chart tiles, from the planner: a cycle is kept as
          # one archive per kind (#535), so CloudFront no longer has a file
          # per tile to answer from. The origin's Caddy hands them to the
          # planner itself, not the gateway (infra/server/Caddyfile's
          # @tiles). Keyed by the address alone, ?c= the cycle and ?r= the
          # revision among it, for the planner's own Cache-Control, a year
          # where the address names both (TilesCachePolicy).
          - PathPattern: api/planner/chart-tile/*
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false  # WebP or PNG, already compressed
            CachePolicyId: !Ref TilesCachePolicy
          # The 3D ground's elevation tiles (the planner's
          # /api/terrain-tile, Terrarium PNGs), the same for every pilot
          # and for weeks: they went to the server uncached, under the
          # default behaviour, at every 3D view.
          - PathPattern: api/planner/terrain-tile/*
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: !Ref TilesCachePolicy
          - PathPattern: app/assets/*
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # managed CachingOptimized
          - PathPattern: api/planner/chart
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SharedAnswersCachePolicy
          - PathPattern: api/planner/airports/search
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SharedAnswersCachePolicy
          - PathPattern: api/planner/aircraft-profiles
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SharedAnswersCachePolicy
          # An airport diagram's picture, its d-TPP cycle in its address
          # (the planner's app.router_basics DIAGRAM_CACHE).
          - PathPattern: api/planner/airport-diagram/*
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false  # PNGs, already compressed
            CachePolicyId: !Ref SharedAnswersCachePolicy
          # The FAA's charts' pages and their list, the edition in each
          # address (the planner's /api/faa-chart).
          - PathPattern: api/planner/faa-chart*
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SharedAnswersCachePolicy
          # The phones' packs of the FAA cycle (the planner's /api/cycle-packs
          # and /api/cycle-pack/{cycle}/{region}.pack), the same for every
          # pilot: the list for the hour it says, each pack for a day at the
          # edge (the policy's most) and its whole cycle on the phone.
          - PathPattern: api/planner/cycle-pack*
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref SharedAnswersCachePolicy
          # The map's FAA overlays as vector tiles (the planner's
          # /api/overlay-tiles and /api/overlay-tiles/{name}.pmtiles): the
          # index for the hour it says, the archive -- its build in its
          # name -- as long as the planner says, at the edge and in the
          # browser; Caddy hands both to the planner itself. The map
          # reads the archive in byte ranges, which CloudFront answers from
          # what it holds (the Range header is never part of the key); not
          # compressed, since its tiles are gzipped inside and a range of
          # a compressed answer would not be the archive's bytes.
          - PathPattern: api/planner/overlay-tiles*
            TargetOriginId: server
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: !Ref TilesCachePolicy
        # A server error is passed on, never kept: CloudFront would hold
        # one for ten seconds by default, and a planner restarting would
        # then outlast itself at the edge.
        CustomErrorResponses:
          - { ErrorCode: 500, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 502, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 503, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 504, ErrorCachingMinTTL: 0 }

  # ---------------------------------------------------------------------
  # Chart tiles, once per cycle: a Fargate Spot task runs the charts job's
  # refresh (services/jobs/charts) every day. In the week before a new
  # cycle's date, once the FAA has it up, it fetches the country's sheets,
  # draws the pyramid, packs each kind into its archives and publishes
  # them to the tiles bucket ahead (wingtip.chart_publish, next.json), which
  # every planner takes at 0901Z on the date; the next run makes it
  # serving.json's. The other days it is a read or two. Spot: an
  # interrupted run starts over the next day, with six more days before the
  # date, and ChartRefreshFailedRule mails a run that stops. Under $1 a
  # cycle.
  # ---------------------------------------------------------------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-jobs"

  EcsClusterCapacityProviders:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref EcsCluster
      CapacityProviders: [FARGATE_SPOT, FARGATE]
      DefaultCapacityProviderStrategy:
        - { CapacityProvider: FARGATE_SPOT, Weight: 1 }

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ChartRefreshTaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the refresh task publish tiles and read the pointer.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PublishTiles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${ChartTilesBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ChartTilesBucket.Arn

  ChartRefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}-chart-refresh"
      RetentionInDays: 30

  ChartRefreshSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: The refresh task reaches out (FAA, S3); nothing reaches in.
      VpcId: !Ref Vpc

  ChartRefreshTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-chart-refresh"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # Two workers drawing tiles, and the country's sheets plus their
      # pyramid on the task's own disk: 6 GB of sheets and 7.4 GB of
      # tiles (1.5 million of them) for the 09-03-2026 cycle, and about
      # 29 GB more of the 512-pixel "@2x" palette tiles from the
      # 12-24-2026 cycle; then each kind's archive written beside its
      # loose tiles before they go, the sectional's @2x the largest. 160 GB,
      # not 100: a run may draw the cycle in force and then stage the next
      # one ahead (charts.next_cycle.stage_to_bucket), two cycles on one
      # disk; the extra is about $0.10 a run.
      Cpu: "2048"
      Memory: "8192"
      EphemeralStorage: { SizeInGiB: 160 }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ChartRefreshTaskRole.Arn
      ContainerDefinitions:
        - Name: chart-refresh
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/wingtip/charts:${ImageTag}"
          # The image's entry point is `python -m charts`.
          Command: ["refresh", "--workers", "2"]
          Environment:
            - { Name: CHART_TILES_BUCKET, Value: !Ref ChartTilesBucket }
            - { Name: CHART_TILES_URL, Value: !Sub "https://${PublicHost}/tiles" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ChartRefreshLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: chart-refresh

  ChartRefreshSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunChartRefresh
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref ChartRefreshTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecutionRole.Arn, !GetAtt ChartRefreshTaskRole.Arn]

  ChartRefreshSchedule:
    Type: AWS::Events::Rule
    DependsOn: EcsClusterCapacityProviders
    Properties:
      Description: Publish the FAA's current chart cycle if it is not published yet, and stage the next one ahead of its date in the week before it; a read or two on the other days.
      ScheduleExpression: cron(30 8 * * ? *)
      State: ENABLED
      Targets:
        - Id: chart-refresh
          Arn: !GetAtt EcsCluster.Arn
          RoleArn: !GetAtt ChartRefreshSchedulerRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref ChartRefreshTaskDefinition
            CapacityProviderStrategy:
              - { CapacityProvider: FARGATE_SPOT, Weight: 1 }
            NetworkConfiguration:
              AwsVpcConfiguration:
                Subnets: [!Ref PublicSubnet]
                SecurityGroups: [!Ref ChartRefreshSecurityGroup]
                AssignPublicIp: ENABLED

  # ---------------------------------------------------------------------
  # Sign-in mail through SES: the domain identity with DKIM, its records
  # in Route 53. SMTP credentials and leaving SES's sandbox are the
  # owner's (docs/README-AWS.md).
  # ---------------------------------------------------------------------
  MailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !If [HasMailDomain, !Ref MailDomain, !Ref PublicHost]
      DkimSigningAttributes: { NextSigningKeyLength: RSA_2048_BIT }

  MailDkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt MailIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt MailIdentity.DkimDNSTokenValue1]

  MailDkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt MailIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt MailIdentity.DkimDNSTokenValue2]

  MailDkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt MailIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt MailIdentity.DkimDNSTokenValue3]

  # ---------------------------------------------------------------------
  # Deploys from GitHub with no stored keys: promote.yml assumes this role
  # through GitHub's OIDC to push the images and run deploy.sh on the
  # server over SSM. Set its ARN as the repo variable AWS_ROLE_ARN.
  # ---------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Condition: HasDeployRole
    Properties:
      Description: GitHub Actions in the production environment (promote.yml) pushes the images and runs deploy.sh on the server.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only a job in the `production` environment: promote.yml's
                # push-ecr and deploy. Not "any workflow on main" -- the
                # workflow_run workflows (ci-autofix.yml) run as main too,
                # while running a branch's code. The environment allows only main to
                # deploy (docs/README-AWS.md), so a branch's workflow that
                # names it is refused before it gets a token.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:environment:production"
      Policies:
        - PolicyName: PushAndDeploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt GatewayRepository.Arn
                  - !GetAtt PlannerRepository.Arn
                  - !GetAtt IngestRepository.Arn
                  - !GetAtt WeatherRepository.Arn
                  - !GetAtt ChartsRepository.Arn
              # The server changes with each Spot interruption, so deploys
              # find it by its Name tag and may run only on that.
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    ssm:resourceTag/Name: !Sub "${AWS::StackName}-server"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

  # ---------------------------------------------------------------------
  # Spending: an email at 80% of $50 a month.
  # ---------------------------------------------------------------------
  # The owner's alerts by email: a failed nightly backup (backup.sh), the
  # app not answering (HealthAlarm), and the alarms below. Each is in
  # docs/RUNBOOKS.md with what to do.
  BackupAlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasBudget
    Properties:
      DisplayName: Wingtip Maps alerts
      Subscription: [{ Protocol: email, Endpoint: !Ref BudgetEmail }]

  # EventBridge publishes the chart refresh's failures and the
  # certificate's expiry warnings to the topic; CloudWatch's alarms need
  # no policy of their own.
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasBudget
    Properties:
      Topics: [!Ref BackupAlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref BackupAlertTopic
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId

  # Is the app up, as a pilot reaches it: through CloudFront to the
  # gateway's health, which counts its database, every 30 seconds from
  # Route 53's checkers round the world. About $1.50 a month. Only in a
  # stack in us-east-1, where Route 53 sends its figures (UsEast1Alerts);
  # elsewhere ChecksMissingAlarm and ServicesAlarm see the server, not
  # the path through CloudFront.
  HealthCheck:
    Type: AWS::Route53::HealthCheck
    Condition: UsEast1Alerts
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !Ref PublicHost
        Port: 443
        ResourcePath: /actuator/health
        RequestInterval: 30
        FailureThreshold: 3
        # CloudFront is SNI-only; without this the handshake can fail and
        # the alarm would say down while the app is fine.
        EnableSNI: true
      HealthCheckTags: [{ Key: Name, Value: !Sub "${AWS::StackName}" }]

  # Not answering for three minutes running: an email, and another when
  # it is back. A Spot interruption's few minutes may send one pair.
  HealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UsEast1Alerts
    Properties:
      AlarmDescription: Wingtip Maps is not answering its health check (Route 53, through CloudFront).
      Namespace: AWS/Route53
      MetricName: HealthCheckStatus
      Dimensions: [{ Name: HealthCheckId, Value: !Ref HealthCheck }]
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref BackupAlertTopic]
      OKActions: [!Ref BackupAlertTopic]

  # ---------------------------------------------------------------------
  # Alarms: what the health check through CloudFront cannot see. The
  # server's own checks (infra/server/health.sh, every five minutes) send
  # the Wingtip namespace's figures; each alarm emails the owner, and
  # again when it clears. docs/RUNBOOKS.md has what to do for each.
  # ---------------------------------------------------------------------
  # The system disk (images, swap, the cron jobs' logs).
  RootDiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudget
    Properties:
      AlarmDescription: The server's system disk is over 85% full (docs/RUNBOOKS.md, "The disk filling").
      Namespace: Wingtip
      MetricName: RootDiskUsedPercent
      Dimensions: [{ Name: Stack, Value: !Ref AWS::StackName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BackupAlertTopic]
      OKActions: [!Ref BackupAlertTopic]

  # The data disk (Postgres, the FAA data, the chart sheets): it grows in
  # place (DataVolumeGb) before it fills.
  DataDiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudget
    Properties:
      AlarmDescription: The server's data disk is over 85% full (docs/RUNBOOKS.md, "The disk filling").
      Namespace: Wingtip
      MetricName: DataDiskUsedPercent
      Dimensions: [{ Name: Stack, Value: !Ref AWS::StackName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BackupAlertTopic]
      OKActions: [!Ref BackupAlertTopic]

  # A service not running, or unhealthy (and restarted by health.sh), at
  # three checks running: a deploy's restart or a planner warming up (its
  # health check allows ten minutes) does not count.
  ServicesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudget
    Properties:
      AlarmDescription: A service on the server (ingest, weather, the planner, the gateway, Postgres or Caddy) has not been running or healthy for 15 minutes (docs/RUNBOOKS.md, "A service down").
      Namespace: Wingtip
      MetricName: ServicesNotHealthy
      Dimensions: [{ Name: Stack, Value: !Ref AWS::StackName }]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BackupAlertTopic]
      OKActions: [!Ref BackupAlertTopic]

  # Caddy's Let's Encrypt certificate for origin.<domain>, renewed 30 days
  # out: under 14 days left, renewal has been failing for two weeks.
  OriginCertAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudget
    Properties:
      AlarmDescription: The origin's certificate (Caddy, Let's Encrypt) has under 14 days left or cannot be read (docs/RUNBOOKS.md, "Certificate renewal").
      Namespace: Wingtip
      MetricName: OriginCertDaysLeft
      Dimensions: [{ Name: Stack, Value: !Ref AWS::StackName }]
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 14
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BackupAlertTopic]
      OKActions: [!Ref BackupAlertTopic]

  # No whole nightly backup for over a day: backup.sh mails its own
  # failures, and this catches one that never ran.
  BackupLateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudget
    Properties:
      AlarmDescription: No nightly backup has reached S3 for over 26 hours (docs/RUNBOOKS.md, "Restore a backup").
      Namespace: Wingtip
      MetricName: BackupAgeHours
      Dimensions: [{ Name: Stack, Value: !Ref AWS::StackName }]
      Statistic: Minimum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 26
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BackupAlertTopic]
      OKActions: [!Ref BackupAlertTopic]

  # The checks themselves stopped (cron gone, the server wedged): no data
  # for 15 minutes is the alarm. A Spot replacement's few minutes may send
  # one pair, as HealthAlarm does.
  ChecksMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudget
    Properties:
      AlarmDescription: The server has sent no health figures for 15 minutes (docs/RUNBOOKS.md, "A Spot interruption").
      Namespace: Wingtip
      MetricName: ChecksRun
      Dimensions: [{ Name: Stack, Value: !Ref AWS::StackName }]
      Statistic: SampleCount
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref BackupAlertTopic]
      OKActions: [!Ref BackupAlertTopic]

  # The gateway's own monitor (UptimeWatch: a service down 5 minutes, a
  # feed stale 15, an FAA data set past its cycle) mails through SES, which
  # can itself be what is broken (credentials, the sandbox). Its ALERT
  # lines are counted from the log here, so they reach the owner without it.
  GatewayAlertFilter:
    Type: AWS::Logs::MetricFilter
    Condition: HasBudget
    Properties:
      LogGroupName: !Ref ServerLogGroup
      FilterPattern: '"ALERT"'
      MetricTransformations:
        - { MetricNamespace: Wingtip, MetricName: GatewayAlerts, MetricValue: "1", DefaultValue: 0, Unit: Count }

  GatewayAlertAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasBudget
    Properties:
      AlarmDescription: The gateway's monitor raised an alert (a service down, a feed stale or a data set past its cycle); its ALERT line in the gateway's log says which (docs/RUNBOOKS.md, "A feed outage").
      Namespace: Wingtip
      MetricName: GatewayAlerts
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref BackupAlertTopic]

  # The chart refresh task stopped by anything but its own clean exit: a
  # failed draw or publish, or Spot taking it back. The old cycle is served
  # until the next day's run (docs/RUNBOOKS.md, "A bad or late FAA cycle").
  ChartRefreshFailedRule:
    Type: AWS::Events::Rule
    Condition: HasBudget
    Properties:
      Description: The chart refresh task stopped without finishing.
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt EcsCluster.Arn]
          lastStatus: [STOPPED]
          $or:
            - containers: { exitCode: [{ anything-but: 0 }] }
            - stopCode: [{ anything-but: EssentialContainerExited }]
      Targets:
        - Id: alert
          Arn: !Ref BackupAlertTopic
          InputTransformer:
            InputPathsMap: { reason: "$.detail.stoppedReason", task: "$.detail.taskArn" }
            InputTemplate: '"Wingtip Maps: the chart refresh task <task> stopped without finishing (<reason>). The old cycle is served until the next run; docs/RUNBOOKS.md, A bad or late FAA cycle."'

  # CloudFront's certificate is ACM's, renewed by itself while its DNS
  # record stands; ACM says so 45 days out when it cannot, on us-east-1's
  # event bus alone (UsEast1Alerts). Elsewhere AWS Health's own mail to
  # the account says so.
  CertificateExpiryRule:
    Type: AWS::Events::Rule
    Condition: UsEast1Alerts
    Properties:
      Description: The app's ACM certificate is near its expiry and has not renewed.
      EventPattern:
        source: [aws.acm]
        detail-type: [ACM Certificate Approaching Expiration]
        resources: [!Ref CertificateArn]
      Targets:
        - Id: alert
          Arn: !Ref BackupAlertTopic

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 50, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  PublicUrl:
    Value: !Sub "https://${PublicHost}/app/plan"
  DistributionId:
    Description: For cache invalidations.
    Value: !Ref Distribution
  ServerName:
    Description: The repo variable AWS_SERVER_NAME, for promote.yml's deploy -- the running server's Name tag.
    Value: !Sub "${AWS::StackName}-server"
  DataVolumeId:
    Value: !Ref DataVolume
  ServerAddress:
    Value: !Ref ServerAddress
  DeployRoleArn:
    Condition: HasDeployRole
    Description: The repo variable AWS_ROLE_ARN (with AWS_REGION the stack's Region).
    Value: !GetAtt DeployRole.Arn
  AppSecretArn:
    Description: Fill in the owner's values here (infra/server/env.example), then run deploy.sh.
    Value: !Ref AppSecret
  ServerBucketName:
    Description: The nightly backups (backups/<date>/) and the chart model (models/chart/current/).
    Value: !Ref ServerBucket
  ChartTilesBucketName:
    Value: !Ref ChartTilesBucket
  ChartRefreshNow:
    Description: Draws and publishes the current chart cycle now, rather than at the next 08:30 UTC run (the first deploy's tiles).
    Value: !Sub >-
      aws ecs run-task --region ${AWS::Region} --cluster ${EcsCluster}
      --task-definition ${ChartRefreshTaskDefinition}
      --capacity-provider-strategy capacityProvider=FARGATE_SPOT,weight=1
      --network-configuration "awsvpcConfiguration={subnets=[${PublicSubnet}],securityGroups=[${ChartRefreshSecurityGroup}],assignPublicIp=ENABLED}"
