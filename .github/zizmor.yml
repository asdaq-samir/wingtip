# zizmor's settings (scripts/ci/workflow_rules.py runs it over the workflows
# at .tool-versions' version). Each exception says why; a finding fixed in the
# workflow is not listed here.
rules:
  # workflow_run is how these follow a finished CI run. Two act on main's
  # own commit or on the run's logs and never check out the pull request's
  # code. ci-autofix.yml checks out a claude/ branch of this repository,
  # never a fork's, to run its formatters: on a job and machine of their
  # own with no token, whose diff alone main's script applies and pushes
  # from another (docs/CI.md, "Rules").
  dangerous-triggers:
    ignore:
      - ci-autofix.yml
      - nightly-issue.yml
      - promote.yml
  # The checkout of a job that pushes keeps its credentials; the rest drop
  # them (persist-credentials: false).
  artipacked:
    ignore:
      - claude-review.yml
  # `uses: ./.github/...` is this commit's own file, the one thing a pin
  # cannot make safer.
  self-repository:
    disable: true
