name: Nightly issue

# A red night opens or updates "Nightly CI failed", and a red run on main
# after a merge (tier 2) "Main CI failed (after merge)": each labelled
# ready and fixed before new work (docs/CI.md; decision 0034), each run of
# CI, Native iOS and Native Android writing its section, one GitHub write
# a run (scripts/ci/nightly_issue.py). Main's push also lists the browser
# tests passed only on retry in "Flaky tests (nightly)"
# (flaky_tests.py --after-merge). Here, not in each workflow, so that
# ci.yml on every pull request need not grant issues: write.

on:
  workflow_run:
    workflows: [CI, Native iOS, Native Android]
    types: [completed]

# Reading the run's jobs, and the one issue it writes.
permissions:
  contents: read
  actions: read
  issues: write

# One at a time, so two workflows' sections never overwrite each other.
concurrency:
  group: nightly-issue
  cancel-in-progress: false

jobs:
  report:
    name: CI issue
    if: github.event.workflow_run.event == 'schedule' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: The run, into its issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 scripts/ci/nightly_issue.py
      # Its e2e-flaky artifacts, read with this run's token (actions: read).
      - if: github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          pattern: e2e-flaky-*
          path: /tmp/flake/e2e/run
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Its flaky tests, into their issue
        if: github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/flaky_tests.py report /tmp/flake --after-merge
