name: CodeQL
# Code scanning on main's push and weekly, never on a pull request, and with no
# dependency cache (docs/CI.md, "The tiers"): GitHub's default setup ran on each
# PR push and filled the cache store. Live once that setup is off (docs/CI.md).
on: {push: {branches: [main]}, schedule: [{cron: "23 10 * * 1"}]}
permissions: {contents: read}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, security-events: write}
    strategy:
      matrix:
        language: [actions, csharp, java-kotlin, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with: {languages: "${{ matrix.language }}", build-mode: none, dependency-caching: false}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
