name: Native iOS test

# The native iOS app built and tested (apps/ios/, docs/NATIVE.md): the engine's
# framework, the Xcode project made by XcodeGen from apps/ios/project.yml, and
# xcodebuild test on the simulators. Called, not triggered: by ci.yml on
# a pull request that touches what the app builds from, so "CI passed"
# -- the one check main requires -- waits for it (#499 merged with a phone
# app not compiling, when the phone builds ran beside CI rather than
# inside it); and by native-ios.yml on main and on claude/native-*, where
# TestFlight follows it.
#
# Actions are pinned as in ci.yml (its opening comment says why).
on:
  workflow_call:
    inputs:
      # The card rule's table-driven UI tests (CardRuleTests,
      # CardScrollTests: every card by every way in, at two text sizes, on
      # each simulator) as well: native-ios.yml's nights and runs by hand.
      # Without it, as on a pull request, they are skipped and
      # CardSmokeTests stands for them on the iPhone, one proof per
      # journey as the browser suite does (docs/CI.md); with them on three
      # simulators the job ran past its forty minutes (run 42843021881).
      full:
        type: boolean
        default: false

permissions:
  contents: read

env:
  WINGTIP_URL: ${{ vars.WINGTIP_URL || 'https://wingtipmaps.app/app/plan' }}
  WINGTIP_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.wingtipmaps.ios' }}

jobs:
  test:
    # GitHub's xcode-27 image (macOS 27, preview), the one hosted image with
    # .tool-versions' Xcode 27.2 (/Applications/Xcode_27.2.app, build 27B52,
    # image 20261104.0337: actions/runner-images,
    # images/macos/xcode-27-arm64-Readme.md); macos-26 has 26.0.1-26.6 only
    # (images/macos/macos-26-arm64-Readme.md), so select-xcode.sh found none.
    runs-on: ${{ vars.MAC_RUNNER || 'xcode-27' }}
    # Forty minutes for a change; the night's full card suites on three
    # simulators take longer, and nothing waits on them.
    timeout-minutes: ${{ inputs.full && 100 || 40 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # .tool-versions' Xcode (scripts/ci/select-xcode.sh, DEVELOPER_DIR for
      # the steps after), before anything builds: the engine's Apple targets
      # link against its SDK too. iPhone Duo's own layout (to the screen's
      # edge, bars down the side) needs the iOS 27.1 SDK or later; an app
      # built with an older one is letterboxed on the inner screen.
      - name: The Xcode .tool-versions names
        run: scripts/ci/select-xcode.sh
      # rustup's tools on the PATH wherever they are: GitHub's macOS image
      # has them already; the Mac mini's runner keeps them in ~/.cargo/bin,
      # which its service PATH did not carry (rustup: command not found,
      # 2026-11-07).
      # The Swift as SwiftFormat writes it (apps/ios/.swiftformat), at the
      # version scripts/dev/format.sh pins and fetches, seconds.
      - name: The Swift's layout
        run: scripts/dev/format.sh --check swift
      - name: rustup on the PATH
        run: '[ -d "$HOME/.cargo/bin" ] && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH" || true'
      # The engine's framework as the last run that built this engine left
      # it: the three Apple targets took 148 s of a 284 s job (run
      # 42110145019), and the engine changes far less often than the app.
      # Keyed on the engine's own files, 23 MB, so the full Actions cache
      # loses little to it.
      - name: The engine, as last built
        id: engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: apps/ios/Frameworks/WingtipEngine.xcframework
          key: engine-ios-${{ hashFiles('engine/facade/**', 'engine/crates/**', 'engine/bindings/ffi/**', 'engine/Cargo.*', 'engine/rust-toolchain.toml') }}
      - name: The engine, for the app
        # wingtip-engine through its C functions (engine/bindings/ffi), which the app
        # answers the airspace from with no network. The runner's rustup,
        # at .tool-versions' Rust (rust-toolchain.toml), where the engine changed.
        if: steps.engine.outputs.cache-hit != 'true'
        run: engine/bindings/ffi/build-xcframework.sh
      # Kept at once, not at the job's end: an app that fails its tests
      # still built the engine right.
      - name: The engine, kept
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: apps/ios/Frameworks/WingtipEngine.xcframework
          key: engine-ios-${{ hashFiles('engine/facade/**', 'engine/crates/**', 'engine/bindings/ffi/**', 'engine/Cargo.*', 'engine/rust-toolchain.toml') }}
      - name: The Xcode project, from project.yml
        run: |
          # The Mac mini's runner has xcodegen already, and no Homebrew.
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml --project apps/ios
      - name: The simulators to test on
        id: sim
        run: |
          # The newest iPhone the runner's Xcode has, whatever it is named,
          # and an iPad -- a Pro where there is one -- for the iPad's own
          # layout (SplitLayout), each by its id.
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          kind = sys.argv[1]
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds if d["name"].startswith(kind)]
          # iPhone Duo is tested on its own, beside a one-screen iPhone.
          devices = [d for d in devices if ("Duo" in d["name"]) == (kind == "iPhone Duo")]
          if not devices:
              sys.exit(0)
          pros = [d for d in devices if "Pro" in d["name"]] if kind == "iPad" else []
          best = sorted(pros or devices, key=lambda d: d["name"])[-1]
          print(best["udid"] + " " + best["name"])' "$1"
          }
          read -r iphone iphone_name <<< "$(pick iPhone)"
          read -r ipad ipad_name <<< "$(pick iPad)"
          read -r duo duo_name <<< "$(pick 'iPhone Duo')"
          echo "iphone=$iphone" >> "$GITHUB_OUTPUT"
          echo "ipad=$ipad" >> "$GITHUB_OUTPUT"
          echo "duo=$duo" >> "$GITHUB_OUTPUT"
          echo "testing on $iphone_name, $ipad_name and ${duo_name:-no iPhone Duo (this Xcode has none)}"
      - name: Built and tested on the simulator
        run: |
          host=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$WINGTIP_URL').hostname)")
          set -o pipefail
          xcodebuild -project apps/ios/Wingtip.xcodeproj -scheme Wingtip -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.iphone }}" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.ipad }}" \
            ${{ steps.sim.outputs.duo && format('-destination "platform=iOS Simulator,id={0}"', steps.sim.outputs.duo) || '' }} \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -resultBundlePath "$RUNNER_TEMP/Wingtip.xcresult" \
            ${{ !inputs.full && '-skip-testing:WingtipUITests/CardRuleTests -skip-testing:WingtipUITests/CardScrollTests -skip-testing:WingtipUITests/CardSmokeTests' || '' }} \
            CODE_SIGNING_ALLOWED=NO WINGTIP_HOST="$host" WINGTIP_BUNDLE_ID="$WINGTIP_BUNDLE_ID" \
            test > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || true
          # The lines that say what happened: each error with what follows
          # it (a resolution failure names its cause on the next line), the
          # tests, and the verdict.
          grep -nE "error:|error\b|Could not|Test (Case|Suite)|Executed|\*\* (BUILD|TEST)" -A6 "$RUNNER_TEMP/xcodebuild.log" | tail -200 || true
          # Each test's own line, and the verdict.
          grep -E "✔ Test|✘ Test|Test run with" "$RUNNER_TEMP/xcodebuild.log" || true
          grep -qE "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"
      - name: The card rule's smoke test, on the iPhone
        # The build above, reused: the airport card opened, scrolled and
        # closed at the default size, the one card test a change waits on.
        if: ${{ !inputs.full }}
        run: |
          set -o pipefail
          xcodebuild -project apps/ios/Wingtip.xcodeproj -scheme Wingtip -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.iphone }}" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -resultBundlePath "$RUNNER_TEMP/CardSmoke.xcresult" \
            -only-testing:WingtipUITests/CardSmokeTests \
            CODE_SIGNING_ALLOWED=NO WINGTIP_BUNDLE_ID="$WINGTIP_BUNDLE_ID" \
            test-without-building > "$RUNNER_TEMP/card-smoke.log" 2>&1 || true
          grep -E "✔ Test|✘ Test|Test run with|error:|XCTAssert" "$RUNNER_TEMP/card-smoke.log" | tail -60 || true
          grep -qE "\*\* TEST EXECUTE SUCCEEDED \*\*|\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/card-smoke.log"
      - name: Each device's first screen
        # What the app shows on launch on the iPhone, the iPad and iPhone
        # Duo (where the runner's Xcode has it), for
        # the pull request's reader: a picture, not a check.
        continue-on-error: true
        run: |
          app="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/Wingtip.app"
          mkdir -p "$RUNNER_TEMP/screens"
          pairs=("iphone:${{ steps.sim.outputs.iphone }}" "ipad:${{ steps.sim.outputs.ipad }}")
          duo=${{ steps.sim.outputs.duo }}
          [ -n "$duo" ] && pairs+=("iphone-duo:$duo")
          for pair in "${pairs[@]}"; do
            name=${pair%%:*}; id=${pair#*:}
            xcrun simctl boot "$id" 2>/dev/null || true
            xcrun simctl bootstatus "$id" -b > /dev/null
            xcrun simctl install "$id" "$app"
            xcrun simctl privacy "$id" grant location "$WINGTIP_BUNDLE_ID" || true
            xcrun simctl launch "$id" "$WINGTIP_BUNDLE_ID"
            sleep 25
            xcrun simctl io "$id" screenshot "$RUNNER_TEMP/screens/$name.png"
          done
          # And the iPad's one search, up in its sidebar.
          ipad=${{ steps.sim.outputs.ipad }}
          xcrun simctl terminate "$ipad" "$WINGTIP_BUNDLE_ID" || true
          xcrun simctl launch "$ipad" "$WINGTIP_BUNDLE_ID" -screen airport
          sleep 15
          xcrun simctl io "$ipad" screenshot "$RUNNER_TEMP/screens/ipad-search.png"
      - name: The screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-ios-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 7
      - name: The log, on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-ios-log
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/card-smoke.log
          retention-days: 7
