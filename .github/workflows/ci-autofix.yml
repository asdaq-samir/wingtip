name: CI autofix

# What happens when CI fails (the owner, 2026-11-15: "the autofix bot only
# formats, and skips a branch pushed to in the last 30 minutes"):
#
# - A job GitHub never ran ("not acquired by Runner", as main's run
#   37366678665 had four) is the runner's fault, not the code's: the
#   failed jobs run again, once.
# - Otherwise, on an open pull request from a claude/ branch of this
#   repository, the branch is formatted (scripts/dev/format.sh, for the
#   languages the pull request changes) and the files that changed are
#   committed and pushed: once per failed head commit, never over the
#   bot's own commit, and not within 30 minutes of the branch's last push,
#   whose session may be pushing again (scripts/ci/autofix_format.sh).
#   It edits nothing else, opens no pull request or issue and comments
#   nowhere: a failure that is not layout is the branch's own to fix, and
#   main's is nightly-issue.yml's to report.
#
# The token: a push made with the workflow's own GITHUB_TOKEN starts no
# workflow (update-branches.yml says the same), so the formatting is
# pushed with MERGE_TOKEN, the owner's, and starts CI like any push of
# his. Without that secret it is pushed with GITHUB_TOKEN, and CI is then
# started on the branch by hand (workflow_dispatch).
#
# The script that decides and pushes is main's; the formatters and their
# settings are the branch's, run with no token in their environment. Fine
# on a repository only its owner pushes to, which this one is (forks'
# pull requests are left out).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# contents: the push where there is no MERGE_TOKEN. actions: the rerun,
# and CI started by hand. pull-requests: finding the branch's own.
permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: The runner's failure, or the code's
        id: cause
        run: |
          set -euo pipefail
          runner=false
          for job in $(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .id'); do
            if gh api "repos/$GH_REPO/check-runs/$job/annotations" --jq '.[].message' | grep -q "not acquired by Runner"; then runner=true; fi
          done
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
      - name: The runner's -- run the failed jobs again, once
        if: steps.cause.outputs.runner == 'true' && env.ATTEMPT == '1'
        run: gh run rerun "$RUN_ID" --failed

      # Main's script, which only reads GitHub to decide: most runs end here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.cause.outputs.runner != 'true'
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Whether to format, and which languages
        id: plan
        if: steps.cause.outputs.runner != 'true'
        env:
          QUIET_MINUTES: 30
        run: scripts/ci/autofix_format.sh plan
      # The commit that failed, beside main's script. format.sh fetches each
      # formatter itself, or skips its language with a note; the Java's wants its JDK
      # (main's .tool-versions, which the sparse checkout keeps at the root).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.plan.outputs.langs != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: branch
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        if: contains(steps.plan.outputs.langs, 'java')
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - name: Format, commit the files that changed, and push
        if: steps.plan.outputs.langs != ''
        working-directory: branch
        env:
          LANGS: ${{ steps.plan.outputs.langs }}
          PUSH_TOKEN: ${{ secrets.MERGE_TOKEN || github.token }}
          HAS_MERGE_TOKEN: ${{ secrets.MERGE_TOKEN != '' }}
        run: ../scripts/ci/autofix_format.sh format
