name: CI autofix

# When CI fails: a job GitHub never ran runs again, once; else a claude/
# pull request is formatted ("the autofix bot only formats"). The branch's
# formatters run with no token on a machine of their own, and only their
# diff reaches the push: scripts/ci/autofix_format.sh says why.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions: { contents: read, actions: write, pull-requests: read }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    outputs:
      langs: ${{ steps.plan.outputs.langs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false, sparse-checkout: scripts/ci }
      - name: The runner's failure, run once more, or the code's to format
        id: plan
        run: scripts/ci/autofix_format.sh plan

  format:
    needs: plan
    if: needs.plan.outputs.langs != ''
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false, sparse-checkout: scripts/ci }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: branch
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        if: contains(needs.plan.outputs.langs, 'java')
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - name: Format, with no token on this machine
        working-directory: branch
        env:
          LANGS: ${{ needs.plan.outputs.langs }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: ../scripts/ci/autofix_format.sh format ../formatted.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: { name: formatted, path: formatted.patch, retention-days: 1 }

  push:
    needs: [plan, format]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions: { contents: write, actions: write, pull-requests: read }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false, sparse-checkout: scripts/ci }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: formatted }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: branch
          persist-credentials: false
      - name: Apply the pull request's own files of the diff, commit and push
        working-directory: branch
        env:
          PUSH_TOKEN: ${{ secrets.MERGE_TOKEN || github.token }}
          HAS_MERGE_TOKEN: ${{ secrets.MERGE_TOKEN != '' }}
        run: ../scripts/ci/autofix_format.sh push ../formatted.patch
