name: Update branches

# Each push to main brings the open claude/ pull requests up to date with
# it, so their CI runs against what they will merge into and a conflict
# shows the moment main makes it, not when the pull request is next
# looked at (the owner, 2026-11-06: development faster). GitHub's "update
# branch" merges main in -- never a rebase, as CLAUDE.md asks of a pushed
# branch.
#
# Gently, as CLAUDE.md's "write to GitHub gently" says: one write at a
# time, ten seconds or more apart, at most ten updates a run (the rest
# wait for main's next push), and a pull request pushed to in the last
# five minutes is left alone, since its session may be pushing again.
#
# A pull request that cannot be updated for a conflict gets the one label
# needs-merge, which comes off when its branch is next current.
#
# The token: a push made with the workflow's own GITHUB_TOKEN starts no
# workflow (GitHub's rule against loops; ci.yml says the same of the
# branches Auto-merge moved), so the pull request would sit with no checks
# and never merge. The update is made with MERGE_TOKEN, the owner's
# fine-grained token Auto-merge already uses, so its merge commit is the
# owner's push and starts CI like any other. Without MERGE_TOKEN it falls
# back on GITHUB_TOKEN and starts CI on the branch by hand
# (workflow_dispatch, which that token may start), whose "CI passed" lands
# on the same commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# One run at a time; a second push to main while one runs waits for it,
# so two runs never write at once.
concurrency:
  group: update-branches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Update the claude/ pull requests that are behind main
        env:
          UPDATE_TOKEN: ${{ secrets.MERGE_TOKEN || github.token }}
          HAS_MERGE_TOKEN: ${{ secrets.MERGE_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_UPDATES: 10
          QUIET_MINUTES: 5
          GAP_SECONDS: 10
          LABEL: needs-merge
        run: scripts/ci/update_branches.sh
