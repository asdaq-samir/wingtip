name: Newer versions

# Once a week, everything this repository pins that has a newer release:
# the toolchains, the web's packages, the Python pins, the engine's crates,
# the Android catalog and the gateway's Maven dependencies, in one standing
# issue, "Newer versions (weekly)", edited rather than opened again
# (scripts/ci/newest_versions.py; docs/versions.md: newest, always, majors
# too). Dependabot opens no pull requests (decision 0024); an upgrade pass
# works from this list. One GitHub write a week at most.
#
# Actions are pinned as in ci.yml (its opening comment says why).

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

# Reading the code, and the one issue it writes.
permissions:
  contents: read
  issues: write

concurrency:
  group: newer-versions
  cancel-in-progress: false

jobs:
  report:
    name: Newer versions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .tool-versions
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
          cache: maven
      - name: The registries' newest, into the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/ci/newest_versions.sh
