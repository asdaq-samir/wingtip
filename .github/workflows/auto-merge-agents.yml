name: Auto-merge agents

# Every claude/ pull request merges into main by itself once "CI passed"
# (main's ruleset; ci.yml's tier 1, docs/CI.md "The tiers"), so nothing
# merges red. Auto-merge goes on as it opens, not after a review: no review
# gates a merge (the owner, 2026-11-06). Dependabot opens none (2026-11-09).
# A review's own fix turns it off again (claude-review.yml's approve job).

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  claude:
    if: >-
      !github.event.pull_request.draft &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event.pull_request.head.repo.fork != true && vars.LINUX_RUNNER || 'ubuntu-26.04' }}
    steps:
      - name: Merge once CI passes
        env:
          # The owner's token where there is one (MERGE_TOKEN): the
          # merge then starts main's workflows.
          GH_TOKEN: ${{ secrets.MERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --merge
