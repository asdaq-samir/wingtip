name: Native Android

# The native Android app (apps/android/, docs/NATIVE-ANDROID.md): the
# engine for three ABIs, then the unit tests and lint. ci.yml calls this on
# a pull request that touches the app, so "CI passed" waits for it (#499).
# Its own runs keep a debug APK; main's pushes and the night the release
# app bundle and its R8 mapping too; the night adds the emulator's tests.
#
# Actions are pinned as in ci.yml (its opening comment says why).
on:
  workflow_call:
  push:
    # A dispatch by name needs the file on main first, hence the branches.
    branches: [main, "claude/native-*"]
    paths:
      - apps/android/**
      - .editorconfig
      - engine/**
      - .tool-versions
      - apps/web/src/lib/fixtures/**
      - scripts/build/api-models-apps.*
      - design/**
      - scripts/build/engine-contract-apps.*
      - .github/workflows/native-android.yml
  workflow_dispatch:
  schedule:
    - cron: "47 9 * * *"

concurrency:
  # Called from ci.yml, github.workflow is "CI" and the ref the pull
  # request's, so a call never shares a group with a run of its own.
  group: native-android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The site the app talks to and whose links open it (App Links); its
  # host is the build's WINGTIP_HOST (apps/android/app/build.gradle.kts).
  WINGTIP_URL: ${{ vars.WINGTIP_URL || 'https://wingtipmaps.app/app/plan' }}
  # This workflow's own runs build the APK as well (scripts/ci/android_build.sh).
  OWN_RUN: ${{ github.workflow == 'Native Android' }}
  RELEASE: ${{ github.workflow == 'Native Android' && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}

jobs:
  build:
    # GitHub's runner, not LINUX_RUNNER (the Mac mini, Apple silicon): the
    # Android SDK's Linux tools and its emulator are x86 only.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Java 25, the build's JDK (apps/android/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
      # Gradle's cache through the Actions cache ('basic', not the commercial
      # 'enhanced'); written from main only, a pull request reads it.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          add-job-summary: on-failure
      - name: The Kotlin's layout
        run: scripts/dev/format.sh --check kotlin
      # The Gradle plugin fetches what the build lacks of the SDK once the
      # licences are taken; not the NDK, .tool-versions' android-ndk, which
      # the image has (AGP's default download failed run 42876898472).
      - name: The SDK's licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      # 90 s for three ABIs (run 42110144706), so cached by the engine's own
      # files and saved at once, for the device job whatever the tests say.
      - name: The engine, as last built
        id: engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: apps/android/app/engine
          key: engine-android-${{ hashFiles('engine/facade/**', 'engine/crates/**', 'engine/bindings/ffi/**', 'engine/Cargo.*', 'engine/rust-toolchain.toml') }}
      - name: The engine, for the app
        if: steps.engine.outputs.cache-hit != 'true'
        run: echo "::notice title=Cache miss::engine-android" && engine/bindings/ffi/build-android.sh
      - name: The engine, kept
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: apps/android/app/engine
          key: engine-android-${{ hashFiles('engine/facade/**', 'engine/crates/**', 'engine/bindings/ffi/**', 'engine/Cargo.*', 'engine/rust-toolchain.toml') }}
      - name: The site's host
        id: site
        run: echo "host=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$WINGTIP_URL').hostname)")" >> "$GITHUB_OUTPUT"
      - name: Tested and linted
        env:
          WINGTIP_HOST: ${{ steps.site.outputs.host }}
          ANDROID_UPLOAD_KEYSTORE: ${{ env.RELEASE == 'true' && secrets.ANDROID_UPLOAD_KEYSTORE || '' }}
          ANDROID_UPLOAD_PASSWORD: ${{ env.RELEASE == 'true' && secrets.ANDROID_UPLOAD_PASSWORD || '' }}
        run: scripts/ci/android_build.sh
      - if: env.OWN_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wingtip-native-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - if: env.RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wingtip-native-release
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
      - name: The lint report, on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wingtip-native-lint
          path: apps/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  device:
    needs: build
    # scripts/ci/android_device_tests.sh: ten minutes and more, so the night's (the owner, 2026-11-06) and by hand.
    if: github.workflow == 'Native Android' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
          add-job-summary: on-failure
      - name: The SDK's licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: The engine, as last built
        id: engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: apps/android/app/engine
          key: engine-android-${{ hashFiles('engine/facade/**', 'engine/crates/**', 'engine/bindings/ffi/**', 'engine/Cargo.*', 'engine/rust-toolchain.toml') }}
      - name: The engine, for the app
        if: steps.engine.outputs.cache-hit != 'true'
        run: engine/bindings/ffi/build-android.sh
      - name: The site's host
        id: site
        run: echo "host=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$WINGTIP_URL').hostname)")" >> "$GITHUB_OUTPUT"
      # The emulator needs the runner's KVM opened (the emulator action's README).
      - name: KVM, for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The instrumented tests, on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          WINGTIP_HOST: ${{ steps.site.outputs.host }}
        with:
          api-level: 35
          arch: x86_64
          working-directory: apps/android
          script: ../../scripts/ci/android_device_tests.sh
      - name: The test reports, on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wingtip-native-device-tests
          path: |
            apps/android/app/build/reports/androidTests
            apps/android/baselineprofile/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 7
