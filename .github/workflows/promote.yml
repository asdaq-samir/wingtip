name: Promote

# What a green CI run on main's push publishes: each image it built
# becomes `:latest`, and, once the AWS variables are set, the images the
# stack deploys go to ECR. It follows CI rather than ending it, so CI's
# time is only how long it takes to learn whether a commit is good.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# In the order the runs finished, one at a time, none cancelled: a later
# commit's promotion must not be overtaken by an earlier one's.
concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Each image of .github/images.hcl the run built (`:sha-<commit>`,
  # ci.yml's build-images) becomes `:latest` by a copy of its manifest,
  # all at once, three tries each, the registry's answer on the checks
  # page when all fail. A failed promotion stays failed: re-run it, as the
  # next run builds only what changed after this commit.
  promote:
    # GitHub's runner, not LINUX_RUNNER (the Mac mini, Apple silicon): it
    # builds and pushes images for AWS's x86 machines.
    runs-on: ubuntu-26.04
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: This commit's images, as latest
        env:
          REPO: ghcr.io/${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          promote() {
            if ! docker buildx imagetools inspect --raw "$REPO/$1:sha-$SHA" > /dev/null 2>&1; then
              echo "$1: not built by this commit"
              return 0
            fi
            for try in 1 2 3; do
              if docker buildx imagetools create --tag "$REPO/$1:latest" "$REPO/$1:sha-$SHA" > "/tmp/promote-$1.log" 2>&1; then
                echo "$1: promoted"
                return 0
              fi
              sleep $((try * 5))
            done
            echo "::error title=$1 not promoted::$(tail -5 "/tmp/promote-$1.log" | tr '\n' ' ' | sed 's/%/%25/g')"
            return 1
          }
          for service in $(docker buildx bake -f .github/images.hcl --print 2>/dev/null | jq -r '.target | keys[]'); do
            promote "$service" &
          done
          failed=0
          for job in $(jobs -p); do wait "$job" || failed=1; done
          exit "$failed"

  # Copies every image the production server runs
  # (infra/docker-compose.prod.yml) from GHCR to ECR as `sha-<commit>` and
  # `latest`: the very images CI tested, not a second build. An image this
  # commit did not rebuild has no `sha-` tag, so ECR's own `latest`, which
  # only this job writes, is tagged for the commit: never GHCR's, which a
  # pull request's packages: write token could once overwrite (security
  # review 2026-11-23, H2). OIDC, no stored AWS keys; skipped until
  # AWS_ROLE_ARN/AWS_REGION are set (the stack's DeployRoleArn). The role
  # trusts only the `production` environment, which only main may deploy to.
  push-ecr:
    # GitHub's runner, not LINUX_RUNNER (the Mac mini): AWS's machines
    # are x86, and so is everything this job touches.
    runs-on: ubuntu-26.04
    needs: promote
    if: vars.AWS_ROLE_ARN != ''
    environment: production
    permissions:
      id-token: write
      packages: read
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
      - name: CI's images, to ECR
        env:
          GHCR: ghcr.io/${{ github.repository }}
          ECR: ${{ steps.ecr-login.outputs.registry }}/wingtip
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # The four images the production server runs
          # (infra/docker-compose.prod.yml) and the charts job's, which the
          # refresh task and the server's hourly overlays run. The retrain
          # job stays out of production (docs/README-AWS.md).
          for service in gateway planner ingest weather charts; do
            source="$GHCR/$service:sha-$SHA"
            if ! docker buildx imagetools inspect --raw "$source" > /dev/null 2>&1; then
              source="$ECR/$service:latest"
            fi
            echo "$service: $source"
            docker buildx imagetools create --tag "$ECR/$service:sha-$SHA" --tag "$ECR/$service:latest" "$source"
          done

  # Then the server takes them: deploy.sh over SSM Run Command (no SSH,
  # no open port), which pulls the new images and restarts what changed.
  # The server is whichever one is running under the stack's name (a Spot
  # interruption replaces it), so it is looked up each time. Only once
  # AWS_SERVER_NAME is set as a repo variable (the stack's ServerName
  # output).
  deploy:
    # GitHub's runner, not LINUX_RUNNER: the production credentials stay
    # off the machine the branches' code runs on.
    runs-on: ubuntu-26.04
    needs: push-ecr
    if: vars.AWS_SERVER_NAME != ''
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # deploy.sh is given the commit CI passed: the server checks it out
      # and runs its `sha-` images (infra/server/deploy.sh).
      - name: Run deploy.sh on the server
        env:
          SERVER: ${{ vars.AWS_SERVER_NAME }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          instance=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=$SERVER" Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$instance" = None ]; then echo "::error title=No server::none running as $SERVER"; exit 1; fi
          id=$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript \
            --comment "deploy ${SHA::7}" --parameters "commands=[\"/srv/wingtip/repo/infra/server/deploy.sh $SHA\"]" \
            --query Command.CommandId --output text)
          # Pulling new images can outlast the CLI's own wait (100 s), so
          # the status is asked after for up to 15 minutes.
          for _ in $(seq 90); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          test "$status" = Success
