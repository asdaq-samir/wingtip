name: Native iOS

# The native app (apps/ios/, docs/NATIVE.md). Its build and tests -- the Xcode
# project made by XcodeGen from apps/ios/project.yml, the tests on a
# simulator, on MAC_RUNNER or GitHub's macOS runner -- are
# native-ios-test.yml, which ci.yml calls on a pull request that touches
# the app, so "CI passed" covers it. Here, those again on main and on
# claude/native-*; and on main, once the owner has set the App Store
# Connect key, the app is archived, signed by Xcode's cloud-managed
# signing and uploaded to TestFlight.
#
# Actions are pinned as in ci.yml (its opening comment says why).
on:
  # Not pull_request: ci.yml runs the tests for one (its `changes` job's
  # `ios`), where "CI passed" waits for them.
  push:
    # And a native-app branch of Claude's: its builds run from the branch
    # itself (a dispatch by name needs the file on main first).
    branches: [main, "claude/native-*"]
    # And the web's files the app bundles (project.yml): the ACS table and
    # the shared fixtures its rules are tested against (docs/NATIVE.md);
    # the engine it links, with the fixtures its tests read; and what
    # makes its API models.
    paths:
      - apps/ios/**
      - apps/web/src/lib/fixtures/**
      - apps/web/src/lib/acs.json
      - engine/**
      - .tool-versions
      - services/planner/tests_wingtip/fixtures/native/**
      - scripts/build/api-models-apps.*
      - design/**
      - scripts/build/engine-contract-apps.*
      - .github/workflows/native-ios.yml
      - .github/workflows/native-ios-test.yml
  workflow_dispatch:
  # Every night, the card rule's full UI suites too (CardRuleTests,
  # CardScrollTests on each simulator): too long for each change, which
  # runs CardSmokeTests in their place (docs/CI.md).
  schedule:
    - cron: "37 9 * * *"

# Its own runs only: a pull request's tests run inside CI's run and under
# CI's group.
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WINGTIP_URL: ${{ vars.WINGTIP_URL || 'https://wingtipmaps.app/app/plan' }}
  WINGTIP_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.wingtipmaps.ios' }}

jobs:
  test:
    uses: ./.github/workflows/native-ios-test.yml
    with:
      full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  testflight:
    needs: test
    # Not the nights: they test, and upload nothing.
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && vars.APP_STORE_KEY_ID != ''
    # xcode-27, the hosted image with .tool-versions' Xcode 27.2, as in
    # native-ios-test.yml.
    runs-on: ${{ vars.MAC_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    env:
      TEAM: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ vars.APP_STORE_KEY_ID }}
      ISSUER: ${{ vars.APP_STORE_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # .tool-versions' Xcode (scripts/ci/select-xcode.sh, DEVELOPER_DIR for
      # the steps after), before anything builds: the engine's Apple targets
      # link against its SDK too. iPhone Duo's own layout (to the screen's
      # edge, bars down the side) needs the iOS 27.1 SDK or later; an app
      # built with an older one is letterboxed on the inner screen.
      - name: The Xcode .tool-versions names
        run: scripts/ci/select-xcode.sh
      # The engine's framework as the last run that built this engine left
      # it: the three Apple targets took 148 s of a 284 s job (run
      # 42110145019), and the engine changes far less often than the app.
      # Keyed on the engine's own files, 23 MB, so the full Actions cache
      # loses little to it.
      - name: The engine, as last built
        id: engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: apps/ios/Frameworks/WingtipEngine.xcframework
          key: engine-ios-${{ hashFiles('engine/facade/**', 'engine/crates/**', 'engine/bindings/ffi/**', 'engine/Cargo.*', 'engine/rust-toolchain.toml') }}
      - name: The engine, for the app
        # wingtip-engine through its C functions (engine/bindings/ffi), which the app
        # answers the airspace from with no network. The runner's rustup,
        # at .tool-versions' Rust (rust-toolchain.toml), where the engine changed.
        if: steps.engine.outputs.cache-hit != 'true'
        run: engine/bindings/ffi/build-xcframework.sh
      - name: The Xcode project, from project.yml
        run: |
          # The Mac mini's runner has xcodegen already, and no Homebrew.
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml --project apps/ios
      - name: Archived, signed and uploaded to TestFlight
        run: |
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEY_P8" > "$key"
          host=$(python3 -c "from urllib.parse import urlparse; print(urlparse('$WINGTIP_URL').hostname)")
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project apps/ios/Wingtip.xcodeproj -scheme Wingtip -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Wingtip.xcarchive" "${auth[@]}" \
            DEVELOPMENT_TEAM="$TEAM" WINGTIP_BUNDLE_ID="$WINGTIP_BUNDLE_ID" WINGTIP_HOST="$host" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive | tail -40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Wingtip.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
