name: Native iOS

# The native app (apps/ios/, docs/NATIVE.md) built once and tested on a simulator a leg (docs/CI.md, "The tiers").
# ci.yml calls this on a pull request that touches the app, the build and its unit tests alone (`unit_only`), so
# "CI passed" waits for it (#499). On its own: main's pushes, the unit tests and the UI smoke on the iPhone and
# the iPad after merge, then TestFlight; claude/native-* pushes; and every night the whole suite (`full`).
#
# Actions are pinned as in ci.yml (its opening comment says why).
on:
  workflow_call:
    inputs:
      # The whole suite on the iPhone, the iPad and iPhone Duo. Without it
      # (main's push, a wave): the unit tests, CardSmokeTests and
      # IPadLayoutTests, iPhone and iPad; DocumentsIPadTests on the iPad.
      full:
        type: boolean
        default: false
      # A pull request's: built, and the unit tests (WingtipTests) on the
      # iPhone, no UI test.
      unit_only:
        type: boolean
        default: false
  push:
    # A dispatch by name needs the file on main first, hence the branches.
    branches: [main, "claude/native-*"]
    # What the app builds from (project.yml), as ci.yml's `ios` filter.
    paths:
      - apps/ios/**
      - apps/web/src/lib/fixtures/**
      - apps/web/src/lib/acs.json
      - engine/**
      - .tool-versions
      - services/planner/tests_wingtip/fixtures/native/**
      - scripts/build/api-models-apps.*
      - design/**
      - scripts/build/engine-contract-apps.*
      - scripts/ci/content-mtimes.py
      - scripts/build/ios-strings.sh
      - scripts/build/licences.sh
      - scripts/ci/ios_*
      - .github/workflows/native-ios.yml
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: true
  schedule:
    - cron: "37 9 * * *"

concurrency:
  # Called from ci.yml, github.workflow is "CI" and the ref the pull
  # request's, so a call never shares a group with a run of its own.
  group: native-ios-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  WINGTIP_URL: ${{ vars.WINGTIP_URL || 'https://wingtipmaps.app/app/plan' }}
  WINGTIP_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.wingtipmaps.ios' }}
  FULL: ${{ inputs.full == true || github.event_name == 'schedule' }}
  UNIT_ONLY: ${{ inputs.unit_only == true }}

jobs:
  test:
    # GitHub's xcode-27 image, the one hosted image with .tool-versions'
    # Xcode 27.2 (actions/runner-images, images/macos/xcode-27-arm64-Readme.md).
    runs-on: ${{ vars.MAC_RUNNER || 'xcode-27' }}
    # A pull request runs the iPhone; main's push the iPad too (the primary device,
    # decision 0058), a wave the iPad's whole suite in four legs; the night iPhone Duo
    # too, each its own runner (three on one ran over 80 minutes, #572). The iPhone's
    # leg builds, the others boot and wait for its build (scripts/ci/ios_products.py).
    name: ${{ matrix.device == 'iPhone' && 'test' || format('test ({0})', matrix.device) }}
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON((inputs.full || github.event_name == 'schedule') && '["iPhone", "iPad", "iPhone Duo"]' || inputs.unit_only && '["iPhone"]' || github.workflow == 'Validate wave' && '["iPhone", "iPad 1/4", "iPad 2/4", "iPad 3/4", "iPad 4/4"]' || '["iPhone", "iPad"]') }}
    # A pull request's set is a few minutes; a wave's quarter of the iPad's suite some thirty with its build, a night's device thirty.
    timeout-minutes: ${{ (inputs.full || github.event_name == 'schedule') && 100 || contains(matrix.device, '/') && 45 || 25 }}
    # actions: read, for the other legs to find the iPhone's build.
    permissions:
      actions: read
      contents: read
    env:
      BUILDS: ${{ matrix.device == 'iPhone' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Before anything builds: the engine's Apple targets link against its
      # SDK too, and iPhone Duo's own layout needs the iOS 27.1 SDK.
      - name: The Xcode .tool-versions names
        run: scripts/ci/select-xcode.sh
      - name: The Swift's layout
        if: env.BUILDS == 'true'
        run: scripts/dev/format.sh --check swift
      # The engine changes far less than the app, so cached by its own files:
      # the simulator's slice alone, all a test links (testflight builds its
      # own; three slices took 342 s, run 44932668280). Saved at once.
      - name: The engine, as last built
        if: env.BUILDS == 'true'
        id: engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: apps/ios/Frameworks/WingtipEngine
          key: engine-ios-sim-${{ hashFiles('engine/facade/**', 'engine/crates/**', 'engine/bindings/ffi/**', 'engine/Cargo.*', 'engine/rust-toolchain.toml') }}
      # The Mac mini's runner keeps rustup in ~/.cargo/bin, off its PATH.
      - name: The engine, for the app
        if: env.BUILDS == 'true' && steps.engine.outputs.cache-hit != 'true'
        env:
          WINGTIP_ENGINE_SLICES: simulator
        run: echo "::notice title=Cache miss::engine-ios" && PATH="$HOME/.cargo/bin:$PATH" engine/bindings/ffi/build-xcframework.sh
      - name: The engine, kept
        if: env.BUILDS == 'true' && steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: apps/ios/Frameworks/WingtipEngine
          key: engine-ios-sim-${{ hashFiles('engine/facade/**', 'engine/crates/**', 'engine/bindings/ffi/**', 'engine/Cargo.*', 'engine/rust-toolchain.toml') }}
      # The project, then DerivedData as main's last build left it. xcodebuild compares file times and a checkout
      # stamps every file anew, so each input is stamped from its content (content-mtimes.py) and XCBuild ignores
      # the new inodes. Written from main and the nights only (a pull request's would crowd the 10 GB of cache).
      - name: The Xcode project, its inputs stamped by content
        if: env.BUILDS == 'true'
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml --project apps/ios
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          python3 scripts/ci/content-mtimes.py apps/ios apps/web/src/lib/fixtures apps/web/src/lib/acs.json \
            services/planner/tests_wingtip/fixtures/native/phone
      - name: DerivedData, as last built
        if: env.BUILDS == 'true'
        id: derived
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/derived
          key: ios-derived-v1-${{ hashFiles('.tool-versions', 'apps/ios/project.yml') }}-${{ github.sha }}
          restore-keys: ios-derived-v1-${{ hashFiles('.tool-versions', 'apps/ios/project.yml') }}-
      - if: env.BUILDS == 'true' && steps.derived.outputs.cache-matched-key == ''
        run: echo "::notice title=Cache miss::ios-derived-data"
      # This leg's device, the newest the runner's Xcode has (an iPad a Pro
      # where there is one), by its id, picked as on the Mac; LEG for ios_test.sh.
      - name: The simulator to test on
        id: sim
        env:
          DEVICE: ${{ matrix.device }}
        run: echo "id=$(xcrun simctl list devices available -j | python3 scripts/dev/newest_simulator.py "${DEVICE%% [0-9]*}")" >> "$GITHUB_OUTPUT" && echo "LEG=$DEVICE" >> "$GITHUB_ENV"
      # Built, then the string catalog's check, then the tests (ios_test.sh picks them), so a stale catalog fails first.
      - name: Built for the simulator
        if: env.BUILDS == 'true'
        env:
          SIM: ${{ steps.sim.outputs.id }}
        run: scripts/ci/ios_test.sh build
      # Every word the Swift says, which the build extracted (SWIFT_EMIT_LOC_STRINGS) and xcodebuild never writes
      # back: a change that adds or drops one commits the catalog scripts/build/ios-strings.sh syncs.
      - name: The string catalog is what the Swift says
        if: env.BUILDS == 'true'
        run: scripts/build/ios-strings.sh --check --derived-data "$RUNNER_TEMP/derived"
      # Settings.bundle's acknowledgements, LicensePlist's from this build's packages (docs/legal/credits.md).
      - name: The acknowledgements are the packages' licences
        if: env.BUILDS == 'true'
        run: scripts/build/licences.sh ios --check "$RUNNER_TEMP/derived/SourcePackages"
      # The build, for the other legs to test (a day: they take it within the run).
      - if: env.BUILDS == 'true' && env.UNIT_ONLY != 'true'
        run: python3 scripts/ci/ios_products.py pack
      - if: env.BUILDS == 'true' && env.UNIT_ONLY != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ios-products
          path: ${{ runner.temp }}/ios-products.tar
          compression-level: 1
          overwrite: true
          retention-days: 1
      - name: The iPhone's build, once it is there
        if: env.BUILDS != 'true'
        env:
          SIM: ${{ steps.sim.outputs.id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ios_products.py fetch
      - name: Tested on the simulator
        env:
          SIM: ${{ steps.sim.outputs.id }}
        run: scripts/ci/ios_test.sh test
      - name: DerivedData, kept
        if: always() && matrix.device == 'iPhone' && steps.derived.outputs.cache-hit != 'true' && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/derived
            !${{ runner.temp }}/derived/Logs
          key: ${{ steps.derived.outputs.cache-primary-key }}
      - name: Each device's first screen
        if: env.FULL == 'true'
        continue-on-error: true
        env:
          SIM: ${{ steps.sim.outputs.id }}
          DEVICE: ${{ matrix.device }}
        run: scripts/ci/ios_screens.sh
      - name: The screens
        if: always() && env.FULL == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-ios-screens-${{ strategy.job-index }}
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 7
      # On a cancel too, with the tests' result bundle: a leg stopped part
      # way kept nothing to read where it stopped (the iPad's 2/2, twice).
      - name: The log, on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-ios-log-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/Wingtip.xcresult
          if-no-files-found: ignore
          retention-days: 7

  testflight:
    needs: test
    # This workflow's own push to main (or a run by hand there), once the
    # App Store Connect key is set; never a call from CI, nor a night.
    if: github.workflow == 'Native iOS' && github.ref == 'refs/heads/main' && github.event_name != 'schedule' && vars.APP_STORE_KEY_ID != ''
    runs-on: ${{ vars.MAC_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    env:
      TEAM: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ vars.APP_STORE_KEY_ID }}
      ISSUER: ${{ vars.APP_STORE_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The Xcode .tool-versions names
        run: scripts/ci/select-xcode.sh
      # The test job kept it a moment ago.
      - name: The engine, as last built
        id: engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: apps/ios/Frameworks/WingtipEngine
          key: engine-ios-${{ hashFiles('engine/facade/**', 'engine/crates/**', 'engine/bindings/ffi/**', 'engine/Cargo.*', 'engine/rust-toolchain.toml') }}
      - name: The engine, for the app
        if: steps.engine.outputs.cache-hit != 'true'
        run: engine/bindings/ffi/build-xcframework.sh
      - name: The Xcode project, from project.yml
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml --project apps/ios
      - name: Archived, signed and uploaded to TestFlight
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: scripts/ci/ios_testflight.sh
