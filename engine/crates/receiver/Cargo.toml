[package]
name = "wingtip-receiver"
version = "0.1.0"
edition = "2024"
publish = false
description = "A portable ADS-B receiver's GDL 90 stream read: its frames, own ship, the traffic it hears and the FIS-B weather it is sent"

[lib]
name = "wingtip_receiver"

# The engine's own crates, below this one (engine/README.md), and the
# base64 crate (MIT/Apache-2.0, the maintained Rust codec) for the bytes a
# host hands receiver_read: plain Rust, so the phones carry it as it is,
# its default `simd-unsafe` feature off. The web asks no receiver rule, so
# the WebAssembly carries none of it.
[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
wingtip-core = { path = "../core" }

[lints]
workspace = true
