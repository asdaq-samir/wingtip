[package]
name = "wingtip-wording"
version = "0.1.0"
edition = "2024"
publish = false
description = "The FAA's own words in the app's: sentence case, names, advisories' intensities, a field's radio and fuel, a VOR's radial and service volume"

[lib]
name = "wingtip_wording"

# Only the engine's own crates, below this one (engine/README.md):
# plain Rust, so the phones carry it as it is.
[dependencies]
wingtip-core = { path = "../core" }
wingtip-procedures = { path = "../procedures" }
wingtip-airspace = { path = "../airspace" }
# The radio script's runway words and pattern exit (brief's runway pick)
# and its ten-mile altitude (route's motion::profile). Without route's
# default features, so a host that leaves route options out keeps them out.
wingtip-brief = { path = "../brief" }
wingtip-route = { path = "../route", default-features = false }

[lints]
workspace = true
