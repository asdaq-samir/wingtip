[package]
name = "wingtip-airspace"
version = "0.1.0"
edition = "2024"
publish = false
description = "The airspace and the cycle packs: whether a volume holds a point, the pack's reader, the rules over a point, the map's overlays in view, the alerts ahead and the places a clearance names"

[lib]
name = "wingtip_airspace"

# The engine's own crates, below this one (engine/README.md), and
# crc32fast for the cycle pack's checksum (pack.rs): plain Rust with no
# system library, so the phones carry it as it is; similar for how alike
# two sounds are (spoken.rs), its diff alone, with none of its features.
[dependencies]
crc32fast = "1.5.5"
similar = { version = "3.2.1", default-features = false }
wingtip-core = { path = "../core" }
wingtip-flight = { path = "../flight" }
wingtip-procedures = { path = "../procedures" }
wingtip-radio = { path = "../radio" }

[lints]
workspace = true
