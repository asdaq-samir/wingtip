[package]
name = "wingtip-altitude"
version = "0.1.0"
edition = "2024"
publish = false
description = "Altitude selection: the terrain and obstacle floor (14 CFR 91.119), the IFR floor (91.177, Part 95's mountainous areas), the band under airspace, clouds (91.155) and the service ceiling, the cruising altitudes by course (91.159, 91.179) and the words where none fits"

[lib]
name = "wingtip_altitude"

# Only the engine's own crates, below this one (engine/README.md):
# plain Rust, so the phones carry it as it is.
[dependencies]
wingtip-core = { path = "../core" }
wingtip-flight = { path = "../flight" }
wingtip-weather = { path = "../weather" }
wingtip-procedures = { path = "../procedures" }

[lints]
workspace = true
