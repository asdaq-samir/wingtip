[package]
name = "wingtip-flight"
version = "0.1.0"
edition = "2024"
publish = false
description = "The flight's own rules: the wind triangle, 14 CFR 91.159's cruising altitudes, 91.151's reserve and the atmosphere"

[lib]
name = "wingtip_flight"

# wingtip-core alone: its JSON and the input reader its rules are asked
# through, and the SI's units (engine/README.md).
[dependencies]
wingtip-core = { path = "../core" }

# The tests' UTC times, from the one calendar (wingtip_core::time) rather
# than a copy of it.
[dev-dependencies]
wingtip-core = { path = "../core" }

[lints]
workspace = true
