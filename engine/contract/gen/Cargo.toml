[package]
name = "wingtip-contract-gen"
version = "0.1.0"
edition = "2024"
publish = false
description = "Writes engine/contract/engine.schema.json from each rule's own contract file, beside its code"

# A developer's tool, never in an app: the engine's crates keep to no
# dependency outside the workspace (engine/README.md), this one may.
# preserve_order keeps each rule's members in the order its file gives
# them, so the assembled schema reads as the files do.
[dependencies]
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
