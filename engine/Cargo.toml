# Wingtip's Rust: the engine (facade/, wingtip-engine, over its domain
# crates in crates/, layered as README.md says), the same answers
# on the planner and the phones, and its Python face (bindings/py,
# wingtip_native), which the planner imports, and its UniFFI face for the
# phones (bindings/ffi, wingtip-ffi, and its generator, bindings/ffi/bindgen),
# and its WebAssembly for the web app (bindings/wasm, wingtip-wasm); and
# the tool that writes the engine's contract from each rule's own contract
# file (contract/gen).
[workspace]
members = [
    "facade",
    "crates/core",
    "crates/flight",
    "crates/weather",
    "crates/procedures",
    "crates/radio",
    "crates/airspace",
    "crates/wording",
    "crates/brief",
    "crates/route",
    "crates/pilot",
    "crates/altitude",
    "crates/inflight",
    "crates/receiver",
    "bindings/py",
    "bindings/ffi",
    "bindings/ffi/bindgen",
    "bindings/wasm",
    "contract/gen",
]
resolver = "3"

# No warning is let stand (the owner, 2026-11-09): every crate's rustc
# warnings are errors, here for every build and not only CI's. Clippy's
# are made errors where it runs (ci.yml's engine job,
# `cargo clippy --workspace --all-targets -- -D warnings`). Each member
# takes these with `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"

[profile.release]
lto = true
codegen-units = 1

# CI's tests build this rather than the release profile: a quicker
# compile, the same answers.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

# The web app's WebAssembly (bindings/wasm, scripts/build/build-engine-wasm.sh): small
# over fast, since every phone downloads it before the first draw and the
# rules it runs take microseconds either way. A profile of its own because
# a profile cannot be set for one package's panic strategy: abort, as
# wasm32-unknown-unknown has no unwinding anyway, which drops the
# unwinding tables.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true
