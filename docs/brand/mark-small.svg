<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The small-size master: the mark alone, drawn for 64 pixels and
       under (the browser tab, the favicon, Android's notification icon,
       the Apple Watch's icon on its chart). The same airplane in the same
       dashed ring as appicon.svg, without the chart's lake and road:
       eight dashes instead of twelve and a heavier airplane, so both hold
       at 16 pixels. The classes let the favicon recolour it at night
       (scripts/build/app_icons.py). -->
  <circle class="ring" cx="16" cy="16" r="13" fill="none" stroke="#A3266F" stroke-width="2.6" stroke-dasharray="7 3.2" transform="rotate(-112.5 16 16)"/>
  <g class="ship" transform="translate(16 16.3) scale(0.36) translate(-32 -31.5)" fill="#14284B" stroke="#14284B" stroke-width="3.5" stroke-linejoin="round">
    <path d="M32 12 C34.2 12 35 14.5 35 18 L34.2 44 L33 51 L31 51 L29.8 44 L29 18 C29 14.5 29.8 12 32 12 Z"/>
    <rect x="9" y="23" width="46" height="6.5" rx="3"/>
    <rect x="23" y="45" width="18" height="4.5" rx="2.2"/>
  </g>
</svg>
