<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The app icon's dark appearance (iOS 18 and later, the Home Screen
       in Dark Mode): appicon.svg's scene at night, as Apple asks of a dark
       icon (Human Interface Guidelines, App icons: a dark background, the
       foreground lit). The chart in the night theme's navy
       (design/tokens.json color.theme.dark), the ring in the mark's night
       magenta (color.brand.mark-ring-night) and the airplane white, with a
       navy halo off the chart instead of a white one. The same geometry
       as appicon.svg, so the two read as one icon. -->
  <rect width="64" height="64" fill="#0B1422"/>
  <path d="M0 0 H30 C26 8 18 13 9 15 C5 16 2 18 0 21 Z" fill="#12304F"/>
  <path d="M38 64 C42 54 50 49 64 47 V64 Z" fill="#1E2430"/>
  <path d="M-2 50 C14 44 22 52 34 46 S54 30 66 32" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.22"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#E37BB5" stroke-width="3.2" stroke-dasharray="7.6 3.4" transform="rotate(-100.4 32 32)"/>
  <g transform="translate(32 32.5) scale(0.64) translate(-32 -31.5)" fill="#0B1422" stroke="#0B1422" stroke-width="7" stroke-linejoin="round">
    <path d="M32 12 C34.2 12 35 14.5 35 18 L34.2 44 L33 51 L31 51 L29.8 44 L29 18 C29 14.5 29.8 12 32 12 Z"/>
    <rect x="9" y="23" width="46" height="6.5" rx="3"/>
    <rect x="23" y="45" width="18" height="4.5" rx="2.2"/>
  </g>
  <g transform="translate(32 32.5) scale(0.64) translate(-32 -31.5)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round">
    <path d="M32 12 C34.2 12 35 14.5 35 18 L34.2 44 L33 51 L31 51 L29.8 44 L29 18 C29 14.5 29.8 12 32 12 Z"/>
    <rect x="9" y="23" width="46" height="6.5" rx="3"/>
    <rect x="23" y="45" width="18" height="4.5" rx="2.2"/>
  </g>
</svg>
