  <!-- The app icon's tinted appearance (iOS 18 and later): a grayscale
       image on black that the system tints with the colour the person
       picks, a lighter grey taking more of the tint (Human Interface
       Guidelines, App icons). The mark carries it: the airplane white,
       the ring a light grey; of the chart only a faint lake and terrain
       band are kept, so the scene is still appicon.svg's. -->
