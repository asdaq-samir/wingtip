# Ruff's settings for every Python file in the repository: the planner's
# and wingtip's, and the few scripts outside them (scripts/ci,
# infra/dev-services, apps/web/scripts). Hidden at the root so the root
# keeps only its few files, and found from any of them, as Ruff looks up
# from each file for the nearest settings.
line-length = 140
extend-exclude = ["*.ipynb"]
# The pyupgrade rules below rewrite what Python 3.13 has replaced. The
# images and CI run 3.15 (services/Dockerfile.base), but at 3.14 or later
# the formatter writes `except A, B:` (PEP 758) for `except (A, B):`, which
# reflows 42 files for no reader's gain, and the scripts the Mac runs with
# its own older python3 (scripts/areas.py, scripts/ci) would not parse.
target-version = "py313"

[lint]
# E/F (pyflakes and pycodestyle's errors) catch real bugs: unused imports,
# undefined names, syntax issues. W adds pycodestyle's warnings, and UP
# (pyupgrade) the spellings a newer Python deprecates or makes needless:
# typing's aliases of collections.abc, lru_cache(maxsize=None). No warning is
# let stand (the owner, 2026-11-09).
select = ["E", "F", "W", "UP"]
# Two of pyupgrade's rewrites are style, not deprecation, and would churn
# some 250 lines in files other branches are editing: timezone.utc for
# datetime.UTC (UP017; both are current) and %-formatting for f-strings
# (UP031).
ignore = ["UP017", "UP031"]

[format]
# `ruff format` (scripts/dev/format.sh python, the version it pins) over
# every Python file here, at the line length above. Matched to how the
# files were written before the formatter came in (2026-11-09), so it
# reflowed as little as it could: each string keeps the quotes it was
# written with, and a trailing comma alone does not hold a call or a
# literal open over several lines when it fits on one.
quote-style = "preserve"
skip-magic-trailing-comma = true
# Left as they are: services/planner/app/detection.py, as a kept read is
# hashed against it (CLAUDE.md); and generated code, each in a generated/
# folder, which its generator's --check compares byte for byte.
exclude = ["services/planner/app/detection.py", "**/generated/**"]
