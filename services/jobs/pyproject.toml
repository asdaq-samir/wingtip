# The jobs' Python suite (charts/tests), run from this directory:
#   ruff check charts && pytest charts/tests/
# The planner's guards and settings, as its own two suites have them.
[tool.pytest.ini_options]
# "." for the jobs (`from charts import overlays`), ../planner for wingtip
# and the guards, as the images' PYTHONPATH has them.
pythonpath = [".", "../planner"]
addopts = "-p no:cacheprovider --strict-markers"
markers = [
    "order_dependent: passes only in the order it was written in; kept out of the random order (pytest_guards.py), and listed to be fixed",
]
