# The jobs' Python suite (charts/tests, crash/tests), run from this directory:
#   ruff check charts crash && pytest charts/tests crash/tests
# The planner's guards and settings, as its own two suites have them.
[tool.pytest.ini_options]
# "." for the jobs (`from charts import overlays`), ../planner for wingtip
# and the guards, as the images' PYTHONPATH has them.
pythonpath = [".", "../planner"]
addopts = "-p no:cacheprovider --strict-markers"
# No warning stands (the owner, 2026-11-09): every warning a test raises
# is an error, so a deprecation is fixed where it starts, not let pile up.
# A third-party warning that cannot be fixed here is let through below by
# its exact message and module, each with why; none is, today.
filterwarnings = [
    "error",
]
markers = [
    "order_dependent: passes only in the order it was written in; kept out of the random order (pytest_guards.py), and listed to be fixed",
]
