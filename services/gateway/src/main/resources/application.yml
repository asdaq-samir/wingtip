spring:
  # Each request, each streamed answer piped from the planner and each
  # scheduled job on a virtual thread (JDK 25, where a thread waiting in
  # synchronized no longer pins its carrier): a nav log or a detection
  # stream holds its thread for minutes while it waits on the planner,
  # and no longer holds one of Tomcat's 200 to do it.
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      # PlannerProxyController's streamed responses (detect/stream,
      # navlog) run as Spring MVC async requests, and the default async
      # timeout (30 s) cut any stream still open past that -- observed
      # as a nav log that simply ended after the altitude stage, no legs
      # and no error line, whenever aviationweather.gov was slow enough
      # for the altitude selection to outlast it. Matches the
      # controller's own 10-minute upstream timeout ("a cold corridor
      # read is tens of seconds and a collection job is minutes; the
      # client is what should give up").
      request-timeout: 600000
  # Signed-in sessions live in Postgres (spring-session-jdbc) and last
  # 30 days of not being used, with a cookie that outlives the browser
  # (server.servlet.session below): sign in once per device a month,
  # not after every half hour away or every gateway restart. The tables
  # come from Flyway (V8__spring_session.sql).
  # Boot 4 no longer takes the session store's timeout from
  # server.servlet.session.timeout: a stored session lasted Spring
  # Session's own default (30 minutes) until this said 30 days again.
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
  # Jackson 3 refuses a null or missing value for a primitive field,
  # where Jackson 2 read it as 0 or false. The request records were
  # written to that contract: a logbook entry's training, instrument and
  # track columns are "none when not sent" (LogbookEntryRequest), and the
  # form, the ForeFlight import and the phones leave them out or send
  # null, so every add, edit and import was a 500. A primitive that must
  # be sent is checked by its constraint (@Positive, @Min(1)); one whose
  # 0 would be a wrong figure rather than none is a boxed @NotNull field
  # (VorCheckRequest.errorDeg, TrackPointDto's time and position).
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  # The clients this app makes of the planner on its own behalf
  # (UpstreamClients, Spring's HTTP interfaces): the planner's rules are
  # milliseconds of the engine's work, so one that takes 20 s is not well;
  # a briefing reads the weather along the route, so it waits 2 minutes. No redirect is
  # followed: one from an upstream is a misconfiguration to surface.
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 30s
      redirects: dont-follow
    serviceclient:
      planner:
        base-url: ${app.planner.base-url}
        read-timeout: 20s
      briefing:
        base-url: ${app.planner.base-url}
        read-timeout: 2m
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wingtip}
    username: ${SPRING_DATASOURCE_USERNAME:wingtip}
    password: ${SPRING_DATASOURCE_PASSWORD:wingtip}
  jpa:
    # Flyway (db/migration/) owns schema now -- validate just checks the
    # entity mapping still matches what Flyway created, it doesn't touch
    # the schema itself.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # The magic-link email flow's own sender (MagicLinkController).
  # Declared unconditionally, unlike Google/Apple's own credentials --
  # spring-boot-starter-mail only auto-configures a JavaMailSender bean
  # once `spring.mail.host` exists as a property at all, even blank, so
  # this has to be here (not left absent) for that bean to exist for the
  # controller to inject in the first place. Unconfigured, sending just
  # fails at the point of use (logged, not thrown -- see the
  # controller's own comment), the same fail-closed shape as every
  # other optional integration in this app.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Sign-in with Google/Apple lives in OAuthClientsConfig (a Java
# @Configuration, @Profile("oauth")), not YAML here -- Apple's own
# client secret is a signed, expiring JWT, not a static string
# Spring Boot's declarative registration properties could ever hold.
# Absent the profile (or absent real credentials within it),
# SecurityConfig registers no oauth2Login and the pilot-scoped
# endpoints answer 401 -- closed, not open. The magic-link flow above
# is independent of this profile entirely.

server:
  port: 8080
  servlet:
    session:
      timeout: 30d
      cookie:
        max-age: 30d
  # Trusts X-Forwarded-Proto/-Host/-Port from the ALB doing TLS
  # termination, so the app sees itself as HTTPS -- without this,
  # Spring Security's HSTS header writer (only fires on a request it
  # considers secure) would silently never send HSTS in production. A
  # no-op locally: nothing sends those headers without a proxy in front.
  forward-headers-strategy: framework
  # gzip for the text the browser downloads: the front-end bundle is
  # 930 KB of JavaScript and 145 KB after gzip, the difference between
  # a second and a fraction of one on a phone. Only these types -- the
  # chart tiles are PNG and already as small as they get, and the
  # planner's NDJSON streams (application/x-ndjson) are left out so a
  # line the planner flushes reaches the browser the moment it is
  # written, not when a gzip block fills. And the engine's WebAssembly
  # (apps/web/src/lib/engine), which the first render waits for: left out, it
  # went as 735 KB where gzip makes it 276 KB, and Lighthouse's phone LCP
  # went from 9.0 s to 13.7 s the night it grew to that (issue #214).
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,application/wasm
    min-response-size: 1024

logging:
  pattern:
    # Each line of a request carries its trace and span (where tracing is
    # on) and the page's request id (RequestIdFilter), so a log line
    # leads to its trace in Jaeger and a trace back to its lines.
    correlation: "[%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

management:
  # Traces (Micrometer's OpenTelemetry bridge) only where they are asked
  # for: docker-compose sets MANAGEMENT_TRACING_EXPORT_ENABLED from
  # TRACING and the OTLP endpoint (Jaeger's). On, each request is a span
  # sent to it, and the planner's spans go under it
  # (TraceHeaders passes the context on); off, nothing is sent.
  # (management.tracing.enabled until Spring Boot 4 renamed it.)
  tracing:
    export:
      enabled: false
  opentelemetry:
    resource-attributes:
      service.name: gateway
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness + /actuator/health/readiness -- Fargate/
      # ALB target-group health checks should hit /readiness (fails if the
      # DB connection pool can't reach RDS); Kubernetes-style liveness/
      # readiness split, but works the same way for ECS.
      probes:
        enabled: true
      group:
        # Spring Boot's own readiness group defaults to readinessState
        # alone -- an app-process-is-up signal, not a dependency check.
        # "db" is the auto-configured DataSource health contributor;
        # without adding it here, a pool that can't reach RDS would
        # still report ready, defeating the ALB check's whole purpose.
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Actuator auto-registers a mail health indicator the moment
    # spring-boot-starter-mail is on the classpath, and by default it
    # feeds into the aggregate /actuator/health -- which docker-compose's
    # own health check (and every service that waits on it) depends on.
    # An unconfigured or unreachable MAIL_HOST must not fail that check
    # the way an unreachable database correctly does; mail is optional,
    # the database is not.
    mail:
      enabled: false

# This app's own settings, bound and checked at start (AppProperties).
app:
  # The Python planner: chart vision, course, checkpoints and nav log.
  # Reached only through this service, which is what lets it publish no
  # port of its own.
  planner:
    base-url: ${PLANNER_SERVICE_URL:http://localhost:8084}
  # Where the front-end bundle is served from -- see WebMvcConfig. The
  # Docker image sets APP_STATIC_LOCATION to a directory beside the jar
  # (front-end changes rebuild the bundle without rebuilding the jar); a
  # local `mvn package` after `vite build` finds it on the classpath.
  static-location: ${APP_STATIC_LOCATION:classpath:/static/app/}
  # A second, HTTPS port for a phone on the same Wi-Fi
  # (HttpsConnectorConfig) -- only when the keystore is named and the
  # file exists; docker-compose.yml names it, infra/local-https/
  # make-certs.sh writes it. Unset on AWS, where the load balancer
  # terminates TLS.
  https:
    keystore: ${APP_HTTPS_KEYSTORE:}
    keystore-password: ${APP_HTTPS_KEYSTORE_PASSWORD:changeit}
    port: ${APP_HTTPS_PORT:8443}
  # The port the routes only other services call (/internal/**) answer on,
  # and only there (InternalPortConfig): published by no compose file, so
  # only the compose network reaches it. 0 opens none.
  internal:
    port: ${APP_INTERNAL_PORT:8081}
  # Sign in with Apple (OAuthClientsConfig, AppleRevocation): the web's
  # team, key and Services ID and the .p8 key's PEM, its line breaks kept;
  # whether the iOS app's sign-in must carry its nonce (AppleNonce,
  # docs/NATIVE.md: off until the app sends one); and where a deleted
  # pilot's grant is revoked.
  apple:
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    services-id: ${APPLE_SERVICES_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
    require-nonce: ${APP_APPLE_REQUIRE_NONCE:false}
    revoke-url: https://appleid.apple.com/auth/revoke
  # Sign in with Google (OAuthClientsConfig).
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  # The apps whose links open in them (AppSiteAssociationController,
  # AssetLinksController) and whose sign-in this app takes
  # (AppleNativeSignInController): the iOS bundle id; the Android package
  # and its signing certificates' SHA-256s, comma-separated.
  ios:
    bundle-id: ${APP_IOS_BUNDLE_ID:}
  android:
    package-name: ${APP_ANDROID_PACKAGE:}
    cert-sha256: ${APP_ANDROID_CERT_SHA256:}
  # Where mail goes out (spring.mail's host, blank where none is set up)
  # and who it is from (Mailer).
  mail:
    host: ${spring.mail.host:}
    from: ${MAIL_FROM:no-reply@wingtipmaps.app}
  # HSTS on by default (right behind that load balancer); off locally,
  # where a browser must not learn to upgrade the plain port.
  hsts: ${APP_HSTS:true}
  # With no sign-in configured, whether planner writes and the billed
  # narrative are open to every caller (true) or refused (false, the
  # default) -- for a machine of one's own with no inbox. The local
  # stack signs in through its own (mailpit); see SecurityConfig.
  open-writes: ${APP_OPEN_WRITES:false}
  # Where a magic-link email's sign-in link points, e.g.
  # https://planner.example.com. Required as soon as MAIL_HOST is set:
  # a link built from the request's own Host or X-Forwarded-Host would
  # point wherever the caller asking for it said.
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  # The addresses whose pilot is a developer (the training workspace, the
  # developer console), comma-separated: granted at that pilot's next
  # request. docker-compose.yml lists the e2e suite's own address; add
  # yours in .env. See PilotService.
  developer-emails: ${APP_DEVELOPER_EMAILS:}
  # The token the nightly lab run sends with its speed measurements
  # (SpeedController, X-Speed-Token); blank refuses them. CI's secret
  # SPEED_LAB_TOKEN holds the same value.
  speed:
    lab-token: ${APP_SPEED_LAB_TOKEN:}
  # The emailed link's own throttle (MagicLinkController): requests an
  # hour per address and per caller. docker-compose.yml loosens both for
  # the local stack, where the e2e suite signs in.
  # The subscription to the paid features (SubscriptionService): whether
  # this deployment sells it at all (off for the proof of concept, at the
  # owner's ask: the page then says nothing of it and the debrief is
  # everyone's), the free month's length, once an account, and the
  # addresses given it without paying, comma-separated (an instructor, a
  # tester). A developer always has it.
  subscription:
    enabled: ${APP_SUBSCRIPTION_ENABLED:false}
    trial-days: ${APP_SUBSCRIPTION_TRIAL_DAYS:30}
    comped-emails: ${APP_SUBSCRIPTION_COMPED_EMAILS:}
  # The MCP connector a pilot adds to their own Claude or ChatGPT
  # (docs/design/mcp-connector.md, security/mcp): the MCP server's
  # address, the audience of every token issued (blank: the public
  # address's /mcp); the callbacks a client may register (Claude's,
  # ChatGPT's, and a loopback one on any port for Claude Code and the MCP
  # Inspector; RedirectUris says the forms); the RSA key, PKCS#8 PEM, its
  # tokens are signed with (blank: one made at start, for a machine of
  # one's own); and the token the planner's tools show to read a pilot's
  # records (blank: refused, and a gateway with the connector on will not
  # start). Off unless MCP_ENABLED: then its authorization server, /mcp and
  # the records routes are all 404s (ConnectorOff), as in production until
  # the connector launches.
  mcp:
    enabled: ${MCP_ENABLED:false}
    resource: ${MCP_RESOURCE_URL:}
    redirect-uris: ${MCP_REDIRECT_URIS:https://claude.ai/api/mcp/auth_callback,https://chatgpt.com/connector_platform_oauth_redirect,https://chatgpt.com/connector/oauth/*,http://localhost,http://127.0.0.1}
    signing-key: ${MCP_SIGNING_KEY:}
    internal-token: ${MCP_INTERNAL_TOKEN:}
    # Open registration held back (RegistrationLimit): so many an address
    # an hour; and clients nobody connected through let go this many days
    # after they registered, each night (ConnectorHousekeeping; "-" off).
    registrations-per-client-per-hour: ${MCP_REGISTRATIONS_PER_CLIENT_PER_HOUR:10}
    unused-client-days: ${MCP_UNUSED_CLIENT_DAYS:1}
    housekeeping-cron: ${MCP_HOUSEKEEPING_CRON:0 45 3 * * *}
  magic-link:
    per-address-per-hour: ${APP_MAGIC_LINK_PER_ADDRESS_PER_HOUR:5}
    per-client-per-hour: ${APP_MAGIC_LINK_PER_CLIENT_PER_HOUR:20}
    # Asks of whose account a link is for (MagicLinkAccountController).
    account-per-client-per-hour: ${APP_MAGIC_LINK_ACCOUNT_PER_CLIENT_PER_HOUR:30}
  # The store reviewers' sign-in (ReviewSignIn, docs/store/listing.md
  # "Review access"): with it on, the one review account below may sign
  # in with a fixed code in place of an emailed link, since a reviewer
  # has no access to its inbox. Off unless REVIEW_SIGN_IN=true; the owner
  # turns it on while a build is in review and off after. Only that
  # address, only that code (at least 20 characters), nobody else.
  review-sign-in:
    enabled: ${REVIEW_SIGN_IN:false}
    email: ${REVIEW_SIGN_IN_EMAIL:}
    code: ${REVIEW_SIGN_IN_CODE:}
  # Where the chart tiles come from when they are published to a CDN
  # (the AWS stack sets this to its CloudFront domain, and the planner
  # tells the browser the same base): the content security policy has
  # to let images load from there. Empty locally, where the tiles are
  # same-origin through the planner proxy.
  chart-tiles-origin: ${APP_CHART_TILES_ORIGIN:}
  # Flight Service's filing and briefing through the app
  # (FlightServiceGateway): "none" until the owner's agreement with a
  # provider (Leidos, in the contiguous U.S.) is in place and its
  # implementation is written.
  flight-service:
    provider: ${APP_FLIGHT_SERVICE_PROVIDER:none}

  # The launch's monitor (UptimeWatch, docs/OPERATIONS.md): each minute
  # (cron, UTC; "-" turns it off) the planner, the weather service and
  # this app's readiness are asked whether they are up, and the
  # planner which live feeds have gone stale; one down for down-after, or a
  # feed the planner calls alerting, is mailed to alert-emails (the
  # developer-emails where none are given), and again when it is back.
  # weather-url is the weather service's address on the stack's network;
  # blank, it is not watched.
  monitoring:
    cron: ${APP_MONITORING_CRON:30 * * * * *}
    down-after: ${APP_MONITORING_DOWN_AFTER:PT5M}
    alert-emails: ${APP_ALERT_EMAILS:}
    weather-url: ${WEATHER_SERVICE_URL:}

  # The Studio's crash drafts (CrashDraftMail, docs/STUDIO-PIPELINE.md):
  # every five minutes (cron, UTC; "-" turns it off) the planner is asked
  # which ready drafts nobody has been mailed about, and each is mailed to
  # the developer-emails with its link under public-base-url.
  studio:
    drafts-cron: ${APP_STUDIO_DRAFTS_CRON:0 */5 * * * *}

# The flight watch (FlightWatchService): how often the watched flights
# departing within the window are re-briefed and the planner asked what
# changed, an ISO duration. Each check is a briefing and the planner's
# changes a watch, so this is also what the watch costs.
wingtip:
  watch:
    every: ${WINGTIP_WATCH_EVERY:PT30M}
