# ArchUnit (ArchitectureTest): today's breaks of a frozen rule live in
# archunit_store, committed. A new break fails; a fixed one is taken out of
# the store as the test runs (commit that). The store is written only when a
# rule is new, by `mvn -B test -Dtest=ArchitectureTest
# -Darchunit.freeze.store.default.allowStoreCreation=true`, never by hand.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false
