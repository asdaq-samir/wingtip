# The settings of both of the planner's Python suites: the service's own
# (tests/, app) and wingtip's (tests_wingtip/, the library). Both run from
# this directory, the rootdir, so its conftest.py and the guards it imports
# (pytest_guards.py) reach both.
[tool.pytest.ini_options]
# "." (this directory) so `from app.main import app` and `from wingtip
# import ...` resolve the way they do inside the container, where the
# WORKDIR is this directory and PYTHONPATH=/workspace/services/planner.
pythonpath = ["."]
# No cache of the last run's failures, which would carry one run's order
# into the next (docs/CI.md, "Flaky tests"), and a mark nobody declared is
# an error rather than a test silently left unmarked.
addopts = "-p no:cacheprovider --strict-markers"
# No warning stands (the owner, 2026-11-09): every warning a test raises
# is an error, so a deprecation is fixed where it starts, not let pile up.
# A third-party warning that cannot be fixed here is let through below by
# its exact message and module, each with why; none is, today.
filterwarnings = [
    "error",
]
markers = [
    "order_dependent: passes only in the order it was written in; kept out of the random order (pytest_guards.py), and listed to be fixed",
]

